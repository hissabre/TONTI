<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TONTI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B3D2C">
<meta name="description" content="TONTI — des tontines plus sûres et plus simples. Groupes, cotisations, versements et protection en FCFA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
/* Layout: one phone-width column (max 440px) on a quiet neutral ground; white cards, one deep-green summary card, fixed 5-tab bar, bottom sheets for actions. Gold is reserved for the logo dot and "your turn" markers. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sand:#F2EBDF; --sand-2:#E5D8C4; --line:#E2E5DF;
  --ink:#15211B; --muted:#5F6B64; --faint:#8E9891;
  --brand:#0B3D2C; --brand-2:#0F4A35; --on-brand:#F7F2E8;
  --primary:#11583D; --on-primary:#FFFFFF; --primary-soft:#E5EFE9;
  --success:#1F7A4D; --success-soft:#E3F0E7; --gold:#D49737; --gold-ink:#87601A; --gold-soft:#F7EDD9;
  --warn:#9C620E; --warn-soft:#FAF0DD; --danger:#A3352A; --danger-soft:#F8E5E1;
  --wm:#0B3D2C;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --r:16px; --shadow:0 1px 2px rgb(21 33 27 / .05),0 4px 14px -6px rgb(21 33 27 / .08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1210; --surface:#121C18; --sand:#1B2822; --sand-2:#2A3A31; --line:#22302A;
  --ink:#ECEFEA; --muted:#9BA7A0; --faint:#6D7972;
  --brand:#0D3B2B; --brand-2:#11483451; --on-brand:#F4EEE2;
  --primary:#2C8A5C; --on-primary:#FFFFFF; --primary-soft:#163024;
  --success:#53B887; --success-soft:#15301F; --gold:#D9A04A; --gold-ink:#E3B766; --gold-soft:#2E2614;
  --warn:#DDA048; --warn-soft:#2D2412; --danger:#E07A6B; --danger-soft:#33201C; --wm:#F1ECE1;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px -8px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1210; --surface:#121C18; --sand:#1B2822; --sand-2:#2A3A31; --line:#22302A;
  --ink:#ECEFEA; --muted:#9BA7A0; --faint:#6D7972;
  --brand:#0D3B2B; --brand-2:#11483451; --on-brand:#F4EEE2;
  --primary:#2C8A5C; --on-primary:#FFFFFF; --primary-soft:#163024;
  --success:#53B887; --success-soft:#15301F; --gold:#D9A04A; --gold-ink:#E3B766; --gold-soft:#2E2614;
  --warn:#DDA048; --warn-soft:#2D2412; --danger:#E07A6B; --danger-soft:#33201C; --wm:#F1ECE1;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px -8px rgb(0 0 0 / .5); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.app.bare{padding-bottom:24px}

/* ---------- Wordmark (vector letters + the real cowrie) ---------- */
.wm{display:block;height:auto;color:var(--wm);overflow:visible}
.wm .dot{fill:var(--gold)}
.wm.light{color:#F7F2E8}

/* ---------- Splash ---------- */
.splash{position:fixed;inset:0;z-index:100;background:#FAF7F0;display:grid;place-items:center;transition:opacity .6s ease,visibility .6s;overflow:hidden}
.splash.out{opacity:0;visibility:hidden}
.splash .pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.38}
.splash-in{position:relative;display:grid;justify-items:center;gap:22px;width:min(78vw,340px)}
.splash .wm{width:100%;color:#0B3D2C}
.splash .wm g,.splash .wm use,.splash .wm circle{transform-box:fill-box;transform-origin:center}
.splash .g-t1{animation:wmIn .7s .55s cubic-bezier(.2,.8,.2,1) both;--dx:-18px}
.splash .g-n{animation:wmIn .7s .7s cubic-bezier(.2,.8,.2,1) both;--dx:18px}
.splash .g-t2{animation:wmIn .7s .8s cubic-bezier(.2,.8,.2,1) both;--dx:18px}
.splash .g-i{animation:wmIn .7s .9s cubic-bezier(.2,.8,.2,1) both;--dx:18px}
.splash .g-cw{animation:cwIn 1.1s cubic-bezier(.3,.7,.2,1) both}
.splash .dot{animation:dotIn .5s 1.3s cubic-bezier(.3,1.5,.5,1) both}
.splash .tag{font:500 17px/1.35 var(--f-serif);color:#3E4C44;text-align:center;animation:fadeUp .7s 1.5s both}
.splash .rule{width:44px;height:2px;background:#D49737;animation:grow .6s 1.4s both;transform-origin:center}
.splash .foot{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:12px;color:#7A857E;letter-spacing:.04em;animation:fadeUp .6s 1.7s both}
@keyframes wmIn{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
@keyframes cwIn{0%{opacity:0;transform:translateY(-14%) rotate(-24deg) scale(.82)}55%{opacity:1}100%{transform:none}}
@keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- Loader: cowrie + three rings (tours, sécurité, sync) ---------- */
.loader{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#FAF7F0;transition:opacity .4s ease,visibility .4s}
.loader.overlay{background:rgb(250 247 240 / .94);backdrop-filter:blur(6px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .loader.overlay{background:rgb(11 18 16 / .9)}}
:root[data-theme="dark"] .loader.overlay{background:rgb(11 18 16 / .9)}
.loader.out{opacity:0;visibility:hidden}
.loader[hidden]{display:none!important}
.ld{display:grid;justify-items:center;gap:26px;text-align:center}
.orbit{position:relative;width:200px;height:200px}
.orbit svg.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit .r-gold{transform-origin:100px 100px;animation:spin 1.8s linear infinite}
.orbit .r-green{transform-origin:100px 100px;animation:spin 3.6s linear infinite reverse}
.orbit .r-ticks{transform-origin:100px 100px;animation:spin 24s linear infinite}
.orbit .seat{fill:#E2D6C3;transition:fill .3s}
.orbit .seat.done{fill:#11583D}
.orbit .seat.now{fill:#D49737}
.orbit .cw{position:absolute;left:50%;top:50%;width:62px;margin:-39px 0 0 -31px;animation:breathe 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgb(60 40 10 / .22))}
.orbit .cw img{display:block;width:100%}
.orbit .sheen{position:absolute;left:50%;top:50%;width:62px;height:78px;margin:-39px 0 0 -31px;-webkit-mask:var(--cw-mask) center/contain no-repeat;mask:var(--cw-mask) center/contain no-repeat;animation:breathe 2.4s ease-in-out infinite;overflow:hidden}
.orbit .sheen::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgb(255 255 255 / .75) 50%,transparent 60%);animation:sheen 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes sheen{0%,35%{transform:translateX(-60%)}75%,100%{transform:translateX(60%)}}
.ld-text{min-height:22px;font-weight:600;font-size:14.5px;color:#2C3A33;transition:opacity .25s}
.ld-sub{font-size:12px;color:#7A857E;letter-spacing:.03em;margin-top:-18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .loader.overlay .ld-text{color:#ECEFEA}}
:root[data-theme="dark"] .loader.overlay .ld-text{color:#ECEFEA}
.ld-bar{width:160px;height:3px;border-radius:3px;background:#E7DDCC;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:#11583D;border-radius:3px;transition:width .35s ease}

/* ---------- Header / nav ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello{flex:1;min-width:0}
.hello small{display:block;font-size:13px;color:var(--muted)}
.hello b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.ibtn:hover{background:var(--surface)}
.ibtn .badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--bg)}
.me-chip{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav[hidden]{display:none}
.nav-in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint)}
.nav button[aria-current="page"]{color:var(--primary)}
.nav svg{width:23px;height:23px}

/* ---------- Building blocks ---------- */
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:12px 2px 0}
.sec-h h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec-h button{font-size:13px;font-weight:600;color:var(--primary)}
.label{font-size:12px;font-weight:600;color:var(--muted)}
.caps{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.amt{font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amt small{font-size:.5em;font-weight:700;letter-spacing:0;margin-left:3px;color:var(--muted)}
.summary{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.summary .label{color:rgb(247 242 232 / .7)}
.summary .amt{font-size:32px;line-height:1.15;margin:4px 0 14px}
.summary .amt small{color:rgb(247 242 232 / .7)}
.summary .pat{position:absolute;right:-30px;top:-30px;width:170px;height:170px;opacity:.09}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid rgb(247 242 232 / .14);padding-top:12px;position:relative}
.sgrid div{min-width:0}
.sgrid b{display:block;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgrid span{font-size:11.5px;color:rgb(247 242 232 / .66)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--primary);color:var(--on-primary);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.99)}
.btn.outline{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.quiet{background:var(--sand);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--success-soft);color:var(--success)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.neutral{background:var(--sand);color:var(--muted)}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sand);color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{color:var(--ink)}}
:root[data-theme="dark"] .av{color:var(--ink)}
.av.me{background:var(--brand);color:var(--on-brand)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;min-width:0}
.row + .row{border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtn{width:100%;text-align:left}
.chev{color:var(--faint);flex:none}
.bar{height:6px;border-radius:6px;background:var(--sand);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--primary)}
.demo{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);border:1px dashed var(--sand-2);border-radius:12px;padding:9px 12px}
.gicon{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--sand);color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gicon{color:var(--ink)}}
:root[data-theme="dark"] .gicon{color:var(--ink)}
.tcard{display:grid;gap:12px;width:100%;text-align:left}
.tcard .amt{font-size:22px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0}
.tile .amt{font-size:19px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:10px 0 11px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--primary);border-color:var(--primary)}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:8px 0;position:relative}
.tl li::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li:first-child::before{top:50%}.tl li:last-child::before{bottom:50%}
.tl .dotc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface);color:var(--faint);box-shadow:inset 0 0 0 2px var(--line);position:relative;z-index:1}
.tl .dotc.done{background:var(--primary);color:#fff;box-shadow:none}
.tl .dotc.now{background:var(--gold);color:#2C1D04;box-shadow:none}
.tl li.mine{background:var(--gold-soft);border-radius:12px;margin:0 -10px;padding:8px 10px;grid-template-columns:30px 1fr auto}
.tl li.mine::before{left:24px}
.meter{display:flex;gap:16px;align-items:center}.meter>div:last-child{min-width:0;flex:1}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:11px;color:var(--muted)}
.steps-l{display:grid}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
.step + .step{border-top:1px solid var(--line)}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--primary-soft);color:var(--primary)}
.step h3{margin:0;font-size:14.5px;font-weight:700}
.step p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:26px 18px;display:grid;justify-items:center;gap:10px}
.empty img{width:52px}

/* ---------- Onboarding ---------- */
.ob{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;padding-block:20px 18px;gap:18px}
.ob .wm{width:132px;margin:6px auto 0}
.ob-hero{position:relative;border-radius:24px;overflow:hidden;background:var(--sand);min-height:250px;display:grid;place-items:center}
.ob-hero svg.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.ob-hero img{position:relative;width:96px;filter:drop-shadow(0 14px 16px rgb(60 40 10 / .25))}
.ob-hero .seats{position:absolute;inset:0;width:100%;height:100%}
.ob h2{font:500 28px/1.15 var(--f-serif);margin:0;text-align:center;text-wrap:balance;letter-spacing:-.01em}
.ob p{margin:8px auto 0;text-align:center;color:var(--muted);max-width:30ch}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots button{width:7px;height:7px;border-radius:7px;background:var(--sand-2);transition:width .2s}
.dots button[aria-current="true"]{width:20px;background:var(--primary)}
.ob-actions{display:grid;gap:10px}

/* ---------- Forms ---------- */
label.f{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-width:0;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.inp:focus{outline:none;border-color:var(--primary)}
.inp.otp{text-align:center;letter-spacing:.6em;font-size:22px;font-weight:700}
.pre{display:flex;gap:8px}.pre .inp{flex:1;min-width:0;width:auto}.pre .cc{flex:none;min-height:50px;padding:0 12px;border-radius:12px;background:var(--sand);display:grid;place-items:center;font-weight:700}
.suffix{position:relative}.suffix .inp{padding-right:64px}.suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:62px;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;padding:4px 8px;color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.switch-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--sand-2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--primary)}.sw[aria-checked="true"]::after{transform:translateX(18px)}
.progress{display:flex;gap:6px}.progress i{flex:1;height:4px;border-radius:4px;background:var(--line)}.progress i.on{background:var(--primary)}
.check{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--primary);box-shadow:none;color:#fff}
.err{color:var(--danger);font-size:13px;font-weight:600;margin:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- Sheet + toast ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgb(8 18 13 / .45);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:440px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:95;transform:translate(-50%,16px);opacity:0;background:#15211B;color:#F4F5F2;
  padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;width:max-content;max-width:min(400px,calc(100% - 32px));transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

      if(r<g.round)g.payouts[r]={to:g.order[r],d:iso(dueDate(g,r)),amount:g.amount*g.order.length};
    }
    return g;
  };

    order:['fd','mk','ac','sk','ms','me','kt','bd','as','im'],round:4,caution:1,fundPct:3,gFirst:3,

    current:{me:'wait',tt:'wait',dc:'ok',kt:'wait'}});

}

function coverage(g){
  let exposure=0,seizable=0,guaranteed=0;const n=g.order.length;
  if(g.status==='active')g.order.forEach((p,i)=>{
    if(i>=g.round)return;
    const st=g.rounds[g.round]?.pay[p]?.s;
    const owed=Math.max(0,(n-g.round)-(st==='ok'||st==='cover'?1:0))*g.amount;
    if(!owed)return;
    exposure+=owed;
    const cau=g.cautions[p]==='held'?Math.min(owed,g.caution*g.amount):0;
    seizable+=cau; if(g.guarantors[p])guaranteed+=owed-cau;
  });
  const cover=g.fund+seizable+guaranteed;
  return {exposure,seizable,guaranteed,cover,ratio:exposure?Math.min(1,cover/exposure):1};
}
function roundState(g){
  const pay=g.rounds[g.round]?.pay||{};
  const vals=g.order.map(p=>pay[p]?.s||'wait');
  return {paid:vals.filter(s=>s==='ok'||s==='cover').length,late:vals.filter(s=>s==='late').length,total:g.order.length};
}
function myStats(){
  let given=0,got=0,toCome=0;const dues=[],nexts=[],history=[];
  S.groups.forEach(g=>{
    if(!g.order.includes(S.me))return;
    for(let r=0;r<=g.round&&r<g.order.length;r++){const e=g.rounds[r]?.pay[S.me];if(e&&e.s==='ok'){given+=g.amount;history.push({g,type:'out',amount:g.amount+fee(g),d:e.d,m:e.m,r})}}
    Object.entries(g.payouts).forEach(([r,po])=>{if(po.to===S.me){got+=po.amount;history.push({g,type:'in',amount:po.amount,d:po.d,r:+r})}});
    const pos=g.order.indexOf(S.me);
    if(g.status==='active'&&pos>=g.round){toCome+=pot(g);nexts.push({g,date:dueDate(g,pos),pos})}
    const st=g.rounds[g.round]?.pay[S.me]?.s;
    if(g.status==='active'&&(st==='wait'||st==='late'))dues.push({g,date:dueDate(g,g.round),late:st==='late'||isLate(g,g.round)});
  });
  history.sort((a,b)=>b.d.localeCompare(a.d));
  return {given,got,toCome,dues,nexts:nexts.sort((a,b)=>a.date-b.date),history};
}

    ${rule('Fonds mutuel',g.fundPct?`${g.fundPct} % de chaque cotisation, soit ${fcfa(fee(g))}.`:'Aucun fonds.',g.fundPct>0)}

const rule=(t,d,on)=>`<div class="step"><span class="n" style="${on?'':'background:var(--sand);color:var(--faint)'}">${on?I(IC.check,13,3):'–'}</span><div class="grow"><h3>${t}</h3><p>${d}</p></div></div>`;
function ring(pct,col,label,unit=''){const c=2*Math.PI*42;return `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--sand)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/></svg><div class="rv"><b>${pct}${unit}</b><span>${label}</span></div></div>`}

    <div class="seg">${[0,1,2].map(v=>`<button data-act="ccau" data-v="${v}" aria-pressed="${d.caution===v}">${v?v+' cotisation'+(v>1?'s':''):'Aucune'}</button>`).join('')}</div></div>

function syncDraft(){
  if(!draft)return;const v=id=>{const e=document.getElementById(id);return e?e.value:null};
  if(v('c-name')!==null)draft.name=v('c-name').trim();
  if(v('c-amount')!==null)draft.amount=Math.max(0,parseInt(v('c-amount').replace(/\D/g,''))||0);
  if(v('c-start')!==null)draft.start=v('c-start')||draft.start;
  if(v('c-nn')!==null){draft.newName=v('c-nn');draft.newPhone=v('c-np')}
}
function protectedOrder(ids){
  const a=ids.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const risky=p=>P(p).score<65||!P(p).v.nina;
  return a.filter(p=>!risky(p)).concat(a.filter(risky));
}
async function createGroup(){
  const d=draft,order=d.orderMode==='protege'?protectedOrder(d.members):d.members.slice();
  const g={id:'g'+uid(),name:d.name,kind:d.kind,amount:d.amount,freq:d.freq,start:d.start,order,round:0,caution:d.caution,fundPct:d.fundPct,guarantorFirst:d.gFirst,
    ninaRequired:d.nina,guarantors:{},cautions:{},debts:{},fund:0,rounds:{0:{pay:{}}},incidents:[],status:'active',payouts:{}};
  order.forEach(p=>{g.cautions[p]=d.caution?'held':'none';g.rounds[0].pay[p]={s:'wait'}});
  const byScore=order.slice().sort((a,b)=>P(b).score-P(a).score);
  order.slice(0,Math.min(d.gFirst,order.length-1)).forEach((p,i)=>{const gar=byScore.find(x=>x!==p&&order.indexOf(x)>i&&!Object.values(g.guarantors).includes(x));if(gar)g.guarantors[p]=gar});
  g.incidents.push({d:iso(TODAY),t:`Tontine créée. Tirage ${d.orderMode==='protege'?'protégé':'manuel'} : ${P(order[0]).name} reçoit en premier.`,k:'ok'});
  S.groups.unshift(g);save();
  await loading(['Tirage au sort','Attribution des garants','Préparation du calendrier'],1900);
  draft=null;go('group',{gid:g.id,tab:'apercu'});toast('Tontine créée. Invitez vos membres depuis l’onglet Membres.');
}

/* ===== Sheets ===== */
function sheet(html){
  closeSheet(true);
  const sc=document.createElement('div');sc.className='scrim';sc.dataset.act='close';
  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
  sh.innerHTML='<div class="grab"></div>'+html;document.body.append(sc,sh);
  requestAnimationFrame(()=>{sc.classList.add('on');sh.classList.add('on')});
}
function closeSheet(now){document.querySelectorAll('.sheet,.scrim').forEach(e=>{if(now)return e.remove();e.classList.remove('on');setTimeout(()=>e.remove(),300)})}

}
function inviteSheet(gid){
  const g=G(gid),msg=`Rejoins notre tontine « ${g.name} » sur TONTI : ${fcfa(g.amount)} ${g.freq==='hebdo'?'par semaine':'par mois'}, cagnotte de ${fcfa(pot(g))}. Code : ${g.id.toUpperCase()}`;
  sheet(`<h2>Inviter des membres</h2><p class="muted small" style="margin:0 0 12px">Copiez ce message et envoyez-le par SMS ou WhatsApp.</p>
    <div class="card flat" id="inv-msg" style="background:var(--sand);border:0">${esc(msg)}</div><button class="btn block" style="margin-top:12px" data-act="copy">Copier le message</button>`);
}
function alertsSheet(){
  S.notifSeen=true;save();const items=[];
  S.groups.forEach(g=>{if(g.status!=='active')return;const pay=g.rounds[g.round].pay;g.order.forEach(p=>{if(pay[p]?.s==='late')items.push({g,p})});if(roundState(g).paid===g.order.length)items.push({g,ready:true})});
  sheet(`<h2>Alertes</h2>${items.length?items.map(x=>x.ready?`<button class="row lbtn" data-act="open" data-g="${x.g.id}" data-tab="paiements"><span class="chip ok">${I(IC.check,14,3)}</span><div class="grow"><div class="name">Collecte complète</div><div class="sub">${esc(x.g.name)} · prêt à verser</div></div>${I(IC.chev,18,2)}</button>`
    :`<button class="row lbtn" data-act="member" data-g="${x.g.id}" data-p="${x.p}">${av(x.p,36)}<div class="grow"><div class="name">${esc(P(x.p).name)} est en retard</div><div class="sub">${esc(x.g.name)} · ${fcfa(x.g.amount)}</div></div>${I(IC.chev,18,2)}</button>`).join(''):'<p class="muted">Rien à signaler.</p>'}`);
  render();
}

/* ===== Actions ===== */
const bump=(pid,d)=>{const p=P(pid);p.score=Math.max(0,Math.min(100,p.score+d))};
const log=(g,t,k)=>g.incidents.push({d:iso(TODAY),t,k});
async function markPaid(gid,pid,m){
  const g=G(gid),e=g.rounds[g.round].pay[pid],wasLate=e.s==='late';closeSheet();
  await loading(m==='cash'?['Enregistrement du paiement','Mise à jour du groupe']:[`Connexion à ${METHODS[m]}`,'Confirmation du paiement','Émission du reçu'],1500);
  Object.assign(e,{s:'ok',m,d:iso(TODAY)});g.fund+=fee(g);
  if(wasLate){bump(pid,-3);log(g,`${P(pid).name} a payé en retard (${METHODS[m]}).`,'ok')}else bump(pid,1);
  save();render();toast(pid===S.me?'Paiement confirmé. Reçu enregistré.':`Paiement de ${first(pid)} enregistré.`);
}
async function cover(gid,pid,how){
  const g=G(gid),e=g.rounds[g.round].pay[pid],p=P(pid);closeSheet();
  await loading(['Activation de la protection','Mise à jour du fonds'],1300);
  if(how==='garant'){const gar=g.guarantors[pid];Object.assign(e,{s:'cover',m:'garant',d:iso(TODAY)});bump(pid,-8);log(g,`${P(gar).name}, garant, a payé la cotisation de ${p.name}.`,'gold')}
  if(how==='caution'){g.cautions[pid]='used';Object.assign(e,{s:'cover',m:'caution',d:iso(TODAY)});bump(pid,-10);log(g,`Caution de ${p.name} saisie pour le tour ${g.round+1}.`,'gold')}
  if(how==='fund'){g.fund-=g.amount;g.debts[pid]=(g.debts[pid]||0)+g.amount;Object.assign(e,{s:'cover',m:'fund',d:iso(TODAY)});bump(pid,-15);log(g,`Le fonds a couvert ${fcfa(g.amount)} pour ${p.name}. Dette enregistrée.`,'bad')}
  save();render();toast('Cotisation couverte. Le bénéficiaire recevra la cagnotte complète.');
}
async function payout(gid){
  const g=G(gid),r=g.round,to=g.order[r];
  await loading(['Vérification de la collecte',`Versement à ${first(to)}`,'Ouverture du tour suivant'],1900);
  g.payouts[r]={to,d:iso(TODAY),amount:pot(g)};log(g,`Tour ${r+1} : ${fcfa(pot(g))} versés à ${P(to).name}.`,'ok');g.round++;
  if(g.round>=g.order.length){g.status='done';g.round=g.order.length-1;Object.keys(g.cautions).forEach(k=>{if(g.cautions[k]==='held')g.cautions[k]='refunded'});log(g,'Cycle terminé. Cautions restituées.','ok');save();render();return toast('Dernier tour versé. Cycle terminé.')}
  g.rounds[g.round]={pay:Object.fromEntries(g.order.map(p=>[p,{s:'wait'}]))};
  save();render();toast(`${fcfa(pot(g))} versés à ${P(to).name}.`);
}
const phoneOk=s=>s.replace(/\D/g,'').length===8;
const fmtPhone=s=>s.replace(/\D/g,'').replace(/(\d{2})(?=\d)/g,'$1 ').trim();

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,gid=b.dataset.g,pid=b.dataset.p;
  switch(a){
    case 'nav':closeSheet();go(b.dataset.to);break;
    case 'open':closeSheet();go('group',{gid,tab:b.dataset.tab||'apercu'});break;
    case 'tab':view.tab=b.dataset.tab;render();break;
    case 'close':closeSheet();break;
    case 'create':draft=newDraft();go('create');break;
    case 'member':memberSheet(gid,pid);break;
    case 'paySelf':paySelfSheet(gid);break;
    case 'markpaid':markPaid(gid,pid,b.dataset.m);break;
    case 'marklate':{const g=G(gid);g.rounds[g.round].pay[pid].s='late';log(g,`${P(pid).name} n’a pas cotisé pour le tour ${g.round+1}.`,'warn');save();closeSheet();render();toast('Retard signalé. Un rappel part automatiquement.');break}
    case 'remind':{const g=G(gid);log(g,`Rappel envoyé à ${P(pid).name}.`,'warn');save();closeSheet();render();toast(`Rappel envoyé à ${first(pid)} (démo).`);break}
    case 'cover':cover(gid,pid,b.dataset.how);break;
    case 'payout':payout(gid);break;
    case 'invite':inviteSheet(gid);break;
    case 'copy':{const t=$('#inv-msg').textContent;try{await navigator.clipboard.writeText(t);toast('Message copié.')}catch(err){const r=document.createRange();r.selectNodeContents($('#inv-msg'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texte sélectionné, copiez-le.')}break}
    case 'alerts':alertsSheet();break;
    case 'verify':verifySheet();break;
    case 'doverify':{const me=P(S.me),ni=$('#v-nina'),ph=$('#v-photo'),er=$('#v-err');
      if(ni&&ni.value.replace(/\s/g,'').length<10){er.textContent='Le numéro NINA doit contenir au moins 10 caractères.';er.hidden=false;return}
      if(!ni&&ph&&!ph.files.length){er.textContent='Choisissez une photo.';er.hidden=false;return}
      closeSheet();await loading(['Envoi sécurisé','Contrôle du document','Mise à jour du score'],1700);
      if(ni){me.v.nina=true;bump(S.me,20)} if(ph&&ph.files.length){me.v.photo=true;bump(S.me,10)}
      save();render();toast('Identité vérifiée. Votre score progresse.');break}
    case 'defpay':S.defPay=b.dataset.m;save();render();break;
    case 'soon':toast('Bamanankan : bientôt disponible.');break;
    case 'reset':{const me=P(S.me);S=seed(me.name,me.phone);save();await loading(['Chargement des exemples'],900);go('home');toast('Exemples rechargés.');break}
    case 'wipe':{const me=P(S.me);S={v:2,me:'me',people:{me:{...me,score:60,v:{tel:true,nina:false,photo:false}}},groups:[],demo:false,account:true,notifSeen:true,defPay:'om'};save();go('home');toast('Tout est effacé.');break}
    case 'logout':S.account=false;save();ob={slide:0,step:'welcome',mode:null,name:'',phone:'',err:''};render();window.scrollTo(0,0);break;
    case 'replay':await splash();break;
    // onboarding
    case 'slide':ob.slide=+b.dataset.i;render();break;
    case 'obStart':ob.mode=b.dataset.mode;ob.step='phone';ob.err='';render();break;
    case 'obBack':ob.step=ob.step==='otp'?'phone':'welcome';ob.err='';render();break;
    case 'obPhone':{const nm=$('#ob-name'),ph=$('#ob-phone');ob.name=nm?nm.value.trim():'';ob.phone=fmtPhone(ph.value);
      if(ob.mode==='signup'&&ob.name.length<3){ob.err='Indiquez votre nom complet.';return render()}
      if(!phoneOk(ob.phone)){ob.err='Le numéro doit comporter 8 chiffres.';return render()}
      ob.err='';await loading(['Envoi du code par SMS'],1000);ob.step='otp';render();setTimeout(()=>$('#ob-otp')?.focus(),50);break}
    case 'obOtp':{const v=$('#ob-otp').value.trim();if(v!=='1234'){ob.err='Code incorrect. En démonstration, saisissez 1234.';return render()}
      await loading(['Vérification du code','Création de votre espace','Chargement de vos tontines'],2100);
      const prev=load();
      if(ob.mode==='login'&&prev&&prev.groups){S=prev;S.account=true}else{S=seed(ob.mode==='signup'?ob.name:null,'+223 '+ob.phone)}
      save();go('home');toast(ob.mode==='signup'?`Bienvenue, ${first(S.me)} !`:'Connexion réussie.');break}
    // création
    case 'cback':syncDraft();draft.err='';if(draft.step>1){draft.step--;render()}else{draft=null;go('tontines')}break;
    case 'ckind':syncDraft();draft.kind=b.dataset.v;render();break;
    case 'camt':syncDraft();draft.amount=+b.dataset.v;render();break;
    case 'cfreq':syncDraft();draft.freq=b.dataset.v;render();break;
    case 'ctoggle':{syncDraft();const i=draft.members.indexOf(pid);i>=0?draft.members.splice(i,1):draft.members.push(pid);render();break}
    case 'cadd':{syncDraft();const nm=draft.newName.trim(),ph=fmtPhone(draft.newPhone);
      if(nm.length<3||!phoneOk(ph)){draft.err='Indiquez un nom et un numéro à 8 chiffres.';return render()}
      const id='p'+uid();S.people[id]={id,name:nm,phone:'+223 '+ph,score:60,v:{tel:false,nina:false,photo:false}};draft.members.push(id);draft.newName=draft.newPhone='';draft.err='';save();render();toast(nm+' ajouté.');break}
    case 'ccau':draft.caution=+b.dataset.v;render();break;
    case 'cfund':draft.fundPct=+b.dataset.v;render();break;
    case 'cgar':draft.gFirst=+b.dataset.v;render();break;
    case 'cnina':draft.nina=!draft.nina;render();break;
    case 'corder':draft.orderMode=b.dataset.v;render();break;
    case 'cnext':{syncDraft();const d=draft;d.err='';
      if(d.step===1){if(d.name.length<3)d.err='Donnez un nom à la tontine (3 caractères minimum).';else if(d.amount<500)d.err='La cotisation doit être d’au moins 500 FCFA.'}
      if(d.step===2&&d.members.length<3)d.err='Il faut au moins 3 membres, vous compris.';
      if(d.err)return render();
      if(d.step<4){d.step++;render();window.scrollTo(0,0)}else createGroup();break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ===== Loader + splash ===== */
(function seats(){let s='';for(let k=0;k<12;k++){const a=k/12*Math.PI*2-Math.PI/2;s+=`<circle class="seat" data-k="${k}" cx="${(100+86*Math.cos(a)).toFixed(2)}" cy="${(100+86*Math.sin(a)).toFixed(2)}" r="3.4"/>`}$('#seats').innerHTML=s})();
let seatTimer=null;
function runSeats(){let k=0;const all=[...document.querySelectorAll('#seats .seat')];clearInterval(seatTimer);
  const tick=()=>{all.forEach((c,i)=>{c.classList.toggle('done',i<k);c.classList.toggle('now',i===k)});k=(k+1)%13};tick();seatTimer=setInterval(tick,140)}
function loading(texts,ms,overlay=true){
  texts=[].concat(texts);const L=$('#loader'),t=$('#ldText'),sub=$('#ldSub'),bar=$('#ldBar');
  L.classList.toggle('overlay',overlay);L.classList.remove('out');L.hidden=false;runSeats();
  t.textContent=texts[0];sub.textContent=overlay?'Connexion sécurisée':'TONTI · Bamako';bar.style.transition='none';bar.style.width='0';
  requestAnimationFrame(()=>{bar.style.transition='width '+ms+'ms cubic-bezier(.3,.1,.3,1)';bar.style.width='100%'});
  const step=ms/texts.length;texts.forEach((x,i)=>{if(i)setTimeout(()=>{t.style.opacity=0;setTimeout(()=>{t.textContent=x;t.style.opacity=1},200)},step*i)});
  return new Promise(res=>setTimeout(()=>{L.classList.add('out');setTimeout(()=>{L.hidden=true;clearInterval(seatTimer);res()},400)},ms+150));
}
function splash(){
  const sp=$('#splash'),clone=sp.cloneNode(true);sp.replaceWith(clone);clone.classList.remove('out');
  return new Promise(res=>{let done=false;const end=()=>{if(done)return;done=true;clone.classList.add('out');res()};
    clone.onclick=end;setTimeout(end,matchMedia('(prefers-reduced-motion: reduce)').matches?500:2700)});
}
async function boot(){
  S=load()||{account:false,people:{},groups:[],me:'me'};
  render();
  await splash();
  await loading(['Chargement de votre espace','Vérification de la sécurité','Synchronisation des tontines'],2000,false);
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
