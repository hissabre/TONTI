/* ===== Assistant vocal (SIMULÉ) =====
   La démo n’active jamais le micro et n’affiche jamais une transcription comme si elle avait été reconnue.
   Les questions d’exemple sont présentées comme telles ; le texte est modifiable avant envoi.
   Aucune action d’argent n’est exécutée par la voix : l’assistant ouvre l’écran, l’utilisateur confirme. */
let asst={mic:false,q:null,text:'',answer:null};
const sampleQ=()=>({next:t('q.next','Quand est ma prochaine cotisation ?'),turn:t('q.turn','Quand est mon tour ?'),total:t('q.total','Combien j’ai cotisé ?'),how:t('q.how','Comment payer ?'),late:t('q.late','Qui est en retard ?')});
function intentOf(x){const v=x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/(retard|late|atras|tard|retras|kɔ|kɔfɛ|yeex|متاخر|تاخر)/.test(v))return 'late';
  if(/(comment|how|como|kɛ cogo|naka|كيف)/.test(v))return 'how';
  if(/(combien|how much|total|cuanto|quanto|joli|nyaata|ñaata|كم)/.test(v))return 'total';
  if(/(tour|turn|turno|vez|dɔn|wa[a]?r|yoon|دور)/.test(v))return 'turn';
  if(/(cotis|pay|pag|prochain|next|proxim|sara|fey|دفع|القادم)/.test(v))return 'next';
  return null}
function answerFor(intent){
  const st=myStats();
  if(intent==='next'){const d=st.dues[0];if(!d)return {icon:IC.check,big:t('h.nothing','Rien à payer'),line:t('sp.allpaid','Toutes vos cotisations sont payées.'),say:()=>t('sp.allpaid','Toutes vos cotisations sont payées.')};
    const k=daysBetween(TODAY,d.date),f=()=>t('sp.due','Vous devez payer {amt} pour {g}, {when}.',{amt:money(due(d.g),d.g.cur),g:d.g.name,when:inDays(Math.max(0,k)).toLowerCase()});
    return {icon:IC.wallet,big:money(due(d.g),d.g.cur),sub:`${esc(d.g.name)} · ${dDay(d.date)}`,line:f(),say:f,act:['pay',d.g.id,t('h.paynow','Payer maintenant')]}}
  if(intent==='turn'){const n=st.nexts[0];if(!n)return {icon:IC.star,big:'—',line:t('as.noturn','Aucun tour à venir.'),say:()=>t('as.noturn','Aucun tour à venir.')};
    const f=()=>n.pos===n.g.round?t('sp.myturn','C’est votre tour dans {g}. Vous recevrez {amt}.',{g:n.g.name,amt:money(pot(n.g),n.g.cur)}):t('sp.turnin','Votre tour dans {g} arrive dans {n} jours. Vous recevrez {amt}.',{g:n.g.name,n:daysBetween(TODAY,n.date),amt:money(pot(n.g),n.g.cur)});
    return {icon:IC.star,big:dDay(n.date),sub:`${esc(n.g.name)} · ${money(pot(n.g),n.g.cur)}`,line:f(),say:f,act:['group',n.g.id,t('a.see','Voir')]}}
  if(intent==='total'){const e=Object.entries(st.given);const txt=e.length?e.map(([c,v])=>money(v,c)).join(' + '):money(0,'XOF');const f=()=>t('as.total','Vous avez cotisé {a} au total.',{a:txt});
    return {icon:IC.send,big:txt,line:f(),say:f,act:['payments','',t('nav.pay','Paiements')]}}
  if(intent==='how'){const f=()=>t('as.how','Touchez Payer maintenant, choisissez votre compte, puis approuvez dans votre application avec votre code secret. Vous recevez un reçu tout de suite.');
    return {icon:IC.zap,big:t('p.how','Comment ça marche'),line:f(),say:f,how:true}}
  if(intent==='late'){const L=[];mine().filter(isT).forEach(g=>g.order.forEach(p=>{if(['late','med','grace'].includes(disp(g,g.round,p)))L.push([g,p])}));
    const f=()=>L.length?t('as.late','En retard : {w}.',{w:L.map(([g,p])=>P(p).name).join(', ')}):t('as.nolate','Personne n’est en retard dans vos tontines.');
    return {icon:IC.alert,big:String(L.length),sub:L.map(([g,p])=>esc(first(p))).join(' · '),line:f(),say:f,act:L[0]?['group',L[0][0].id,t('a.see','Voir')]:null}}
  const f=()=>t('as.unknown','Je n’ai pas compris. Essayez une des questions proposées.');return {icon:IC.info,big:'?',line:f(),say:f}
}
function assistantSheet(){
  const ok=(S.consents||[]).some(c=>c.doc==='voice');const vs=vset(),L=SPOKEN[vs.lang];
  if(!ok)return sheet(`<div class="mic" style="background:var(--surface-2);color:var(--primary);box-shadow:none">${I(IC.mic,44)}</div><h2 style="text-align:center">${t('as.title','Assistant vocal')}</h2>
    <div class="card" style="display:grid;gap:10px;margin-top:10px">
      ${[[IC.mic,t('as.c1','Pour comprendre votre voix, l’enregistrement serait envoyé à un service de reconnaissance vocale.')],[IC.clock,t('as.c2','Conservation et suppression : règles à définir (projet à valider).')],[IC.flask,t('as.c3','Dans cette démonstration, le micro n’est jamais activé et rien n’est enregistré.')],[IC.shield,t('as.c4','Aucun paiement n’est fait par la voix : vous confirmez toujours à l’écran.')]].map(([ic,x])=>`<div style="display:flex;gap:10px;align-items:flex-start"><span class="ricon sm">${I(ic,18)}</span><span class="small" style="padding-top:6px">${x}</span></div>`).join('')}</div>
    <button class="btn xl block" style="margin-top:14px" data-act="asCons">${t('as.accept','J’accepte')}</button><button class="btn sand block" style="margin-top:8px" data-act="close">${t('as.later','Plus tard')}</button>`);
  const Q=sampleQ(),qs=['next','turn','total','how'].concat(mine().some(isT)?['late']:[]);const A=asst.answer;
  sheet(`<div style="display:flex;align-items:center;gap:8px"><h2 class="grow">${t('as.title','Assistant vocal')}</h2><span class="chip neutral">${I(IC.speaker,13)}${esc(L.n)}</span></div>
    <button class="mic ${asst.mic&&!A?'on':''}" data-act="asMic" aria-label="${esc(t('as.tap','Touchez pour parler'))}">${I(IC.mic,46)}</button>
    <p style="text-align:center;margin:4px 0 0;font-weight:700">${t('as.tap','Touchez pour parler')}</p>
    ${asst.mic?`<div class="draft" style="margin-top:12px;background:var(--gold-soft);color:var(--gold-ink)">${I(IC.flask,20)}<span>${t('as.nomic','Démonstration : le micro n’est pas utilisé. Choisissez une question d’exemple ou écrivez-la.')}</span></div>`:''}
    <div class="caps" style="margin:14px 0 8px">${t('as.samples','Questions d’exemple')}</div>
    <div class="chips">${qs.map(k=>`<button data-act="asQ" data-q="${k}" aria-pressed="${asst.q===k}">${esc(Q[k])}</button>`).join('')}</div>
    <label class="f" style="margin-top:14px">${t('as.text','Texte de la question (modifiable)')}<input class="inp" id="as-text" value="${esc(asst.text)}"></label>
    <p class="hint" style="margin-top:6px">${t('as.textnote','En production, ce champ affichera ce que l’assistant a compris, pour que vous puissiez corriger.')}</p>
    <button class="btn block" style="margin-top:10px" data-act="asAsk">${I(IC.send,18)}${t('as.ask','Demander')}</button>
    ${A?`<div class="ans" style="margin-top:14px"><div style="display:flex;gap:12px;align-items:center"><span class="ricon">${I(A.icon,22)}</span><div class="grow" style="min-width:0"><div style="font-size:22px;font-weight:800;line-height:1.2">${A.big}</div>${A.sub?`<div class="sub wrap">${A.sub}</div>`:''}</div>${lsn('answer')}</div>
      <p style="margin:0">${esc(A.line)}</p>
      ${A.how?`<div class="how"><div><span class="n">${I(IC.send,22)}</span>${t('p.how1','TONTI envoie la demande')}</div><div><span class="n">${I(IC.mobile,22)}</span>${t('p.how2','Vous approuvez dans votre application')}</div><div><span class="n">${I(IC.zap,22)}</span>${t('p.how3','Reçu instantané')}</div></div>`:''}
      ${A.act?`<button class="btn sand block" data-act="asGo" data-k="${A.act[0]}" data-arg="${A.act[1]}">${esc(A.act[2])}</button>`:''}
      <p class="hint">${t('as.safe','Aucune action d’argent n’est faite par la voix : vous confirmez toujours à l’écran.')}</p></div>
      <button class="link" style="margin-top:10px" data-act="asReset">${I(IC.refresh,15)} ${t('as.again','Autre question')}</button>`:''}`);
}

/* ===== Actions ===== */
async function copyText(x,el){try{await navigator.clipboard.writeText(x);toast(t('a.copied','Copié.'))}catch(err){if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast(t('a.select','Sélectionnez le texte pour le copier.'))}}
function selectOne(b){document.querySelectorAll(`[data-act="${b.dataset.act}"]`).forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on);if(x.classList.contains('opt'))x.style.boxShadow=on?'inset 0 0 0 2px var(--primary)':'';const c=x.querySelector('.check');if(c){c.classList.toggle('on',on);c.innerHTML=on?I(IC.check,14,3):''}})}
const phoneOk=(s,cc)=>{const n=s.replace(/\D/g,'').length,L=COUNTRIES[cc].len;return n>=L[0]&&n<=L[1]};
const fmtPhone=s=>s.replace(/\D/g,'').replace(/(\d{2})(?=\d)/g,'$1 ').trim();
function setLang(l){LANG=l;try{localStorage.setItem('tonti.lang',l)}catch(e){}}

document.addEventListener('change',e=>{
  if(e.target.id==='ob-cc'){ob.cc=e.target.value;const nm=$('#ob-name'),ph=$('#ob-phone');if(nm)ob.name=nm.value;if(ph)ob.phone=ph.value;render()}
  if(e.target.id==='pf-cc'){const me=P(S.me),cc=e.target.value;me.cc=cc;if(!COUNTRIES[cc].acc.includes(me.acct))me.acct=COUNTRIES[cc].acc[0];save();render();toast(t('pf.ccset','Pays : {c}. Nouvelles tontines en {cur}.',{c:countryName(cc),cur:COUNTRIES[cc].cur}))}
  if(e.target.id==='c-cc'&&draft){syncDraft();draft.amount=CUR[COUNTRIES[draft.cc].cur].presets[1];render()}
});
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,gid=b.dataset.g,pid=b.dataset.p;
  if(a==='openLegal'){ev.stopPropagation();openLegal(b.dataset.doc);return}
  switch(a){
    case 'nav':closeSheet();{const to=b.dataset.to,from=view.name==='group'?'group':view.name==='home'?'home':'profile';
      if(to==='protect')go('protect',{gid:gid||view.gid,from});else if(to==='group')go('group',{gid:gid||view.gid});else if(to==='legal')go('legal',{doc:b.dataset.doc||'hub'});else go(to)}break;
    case 'open':closeSheet();go('group',{gid,tab:b.dataset.tab||'apercu'});break;
    case 'tab':view.tab=b.dataset.tab;render();break;
    case 'filter':view.filter=b.dataset.f;view.more=false;render();break;
    case 'more':view.more=true;render();break;
    case 'protG':view.gid=gid;render();break;
    case 'close':closeSheet();break;
    case 'say':{const w=b.dataset.what,tx=b.dataset.tx&&txById(b.dataset.tx);
      const B={home:homeSpeech,group:()=>groupSpeech(G(gid)),pay:()=>paySpeech(G(gid)),result:()=>resultSpeech(tx),payout:()=>payoutSpeech(G(gid)),prot:protSpeech,onb:onbSpeech,sample:sampleSpeech,answer:()=>asst.answer?asst.answer.say():''}[w];
      if(B){LAST_SAY=B;say(B)}break}
    case 'sayFr':if(LAST_SAY)say(LAST_SAY,'fr');break;
    case 'stopVoice':Services.voice.stop();hidePlayer();break;
    case 'assistant':assistantSheet();break;
    case 'asCons':S.consents.push({doc:'voice',ver:LEGAL_VER,d:iso(TODAY),t:nowT()});save();assistantSheet();break;
    case 'asMic':asst.mic=true;assistantSheet();break;
    case 'asQ':asst.q=b.dataset.q;asst.text=sampleQ()[b.dataset.q];asst.answer=null;assistantSheet();break;
    case 'asAsk':{const v=($('#as-text').value||'').trim();if(!v)return;if(v!==asst.text){asst.q=null;asst.text=v}asst.answer=answerFor(asst.q||intentOf(v));assistantSheet();LAST_SAY=()=>asst.answer.say();say(LAST_SAY);break}
    case 'asReset':asst={mic:false,q:null,text:'',answer:null};assistantSheet();break;
    case 'asGo':{const k=b.dataset.k,a2=b.dataset.arg;closeSheet();if(k==='pay')paySheet(a2);else if(k==='group')go('group',{gid:a2});else if(k==='payments')go('payments');else if(k==='protect')go('protect',{gid:a2,from:'home'});break}
    case 'vLang':vset().lang=b.dataset.l;save();render();break;
    case 'vPref':vset().pref=b.dataset.v;save();render();break;
    case 'vAuto':vset().auto=!vset().auto;save();render();break;
    case 'obVLang':ob.vlang=b.dataset.l;vset().lang=b.dataset.l;render();break;
    case 'create':draft=newDraft();go('create');break;
    case 'join':joinSheet();setTimeout(()=>$('#j-code')?.focus(),320);break;
    case 'doJoin':{const v=($('#j-code').value||'').trim().toUpperCase(),g=S.groups.find(x=>x.code===v),er=$('#j-err');
      if(!g){er.textContent=t('jn.unknown','Code inconnu. Vérifiez-le auprès du trésorier.');er.hidden=false;return}
      if(g.order.includes(S.me)){closeSheet();go('group',{gid:g.id});return toast(t('jn.already','Vous êtes déjà membre.'))}
      if(g.round>0){er.textContent=t('jn.started','Ce cycle a déjà commencé.');er.hidden=false;return}joinPreview(g);break}
    case 'jnPact':{const c=$('#jnCk');const on=!c.classList.contains('on');c.classList.toggle('on',on);c.innerHTML=on?I(IC.check,14,3):'';break}
    case 'confirmJoin':{if(!$('#jnCk').classList.contains('on')){const er=$('#jn-err');er.textContent=t('jn.need','Signez le pacte pour rejoindre.');er.hidden=false;return}
      const g=G(gid);closeSheet();await loading([t('ld.sign','Signature du pacte'),t('ld.enrol','Inscription'),t('ld.cal','Préparation du calendrier')],1800);
      if(!g.order.includes(S.me)){g.order.push(S.me);g.pact.push(S.me);g.cautions[S.me]=g.caution?'held':'none';g.rounds[0].pay[S.me]={s:'wait'};assignGuarantors(g);
        S.consents.push({doc:'pact',gid:g.id,ver:LEGAL_VER,d:iso(TODAY),t:nowT()});log(g,'log.join',{who:P(S.me).name},'ok')}
      save();go('group',{gid:g.id,tab:'calendrier'});toast(t('jn.welcome','Bienvenue dans « {g} ».',{g:g.name}));break}
    case 'member':memberSheet(gid,pid);break;
    case 'paySelf':paySheet(gid);break;
    case 'payAcct':pay.acct=b.dataset.k;selectOne(b);break;
    case 'payGo':payApproveStep();break;
    case 'payDone':payDone();break;
    case 'qr':qrSheet(gid);break;
    case 'payDoneQR':{const g=G(gid);pay={gid,acct:CC(g).acc.includes(P(S.me).acct)?P(S.me).acct:CC(g).acc[0]};payDone();break}
    case 'cash':cashSheet(gid);break;
    case 'doCash':{const g=G(gid);closeSheet();await loading([t('ld.decl','Déclaration'),t('ld.notif','Notification du trésorier')],1000);
      const res=contribute(g,S.me,'cash');save();render();if(res.dup)return toast(t('pay.dup','Cette cotisation est déjà enregistrée.'));
      if(!isT(g))Services.notify.send({to:P(g.treasurer).phone,channel:'sms',text:t('sms.cash','TONTI : {w} déclare vous avoir remis {a} en espèces.',{w:P(S.me).name,a:money(due(g),g.cur)})});
      save();toast(isT(g)?t('cash.ok','Espèces enregistrées.'):t('cash.wait','{w} doit confirmer.',{w:first(g.treasurer)}));break}
    case 'pendingSheet':pendingSheet(b.dataset.tx);break;
    case 'settle':{const x=txById(b.dataset.tx);if(!x||x.st!=='pending')return closeSheet();closeSheet();await loading([t('ld.settle','Règlement {r}',{r:railName(x.rail)})],900);
      settlePending(x,b.dataset.ok==='1');render();if(x.p===S.me)resultSheet(x);else toast(x.st==='success'?t('st.ok','Payé'):t('st.expired','Expiré'));break}
    case 'txSheet':txSheet(b.dataset.tx);break;
    case 'confirm':{const x=txById(b.dataset.tx);closeSheet();await loading([t('ld.cash','Encaissement des espèces'),t('ld.receipt','Émission du reçu')],1000);confirmCash(x,true);render();toast(t('cf.ok','{w} : paiement confirmé.',{w:first(x.p)}));break}
    case 'reject':rejectSheet(b.dataset.tx);break;
    case 'rejMotif':selectOne(b);break;
    case 'doReject':{const x=txById(b.dataset.tx),m=$('[data-act="rejMotif"][aria-pressed="true"] b').textContent;confirmCash(x,false,m);
      Services.notify.send({to:P(x.p).phone,channel:'sms',text:t('sms.rej','TONTI : votre paiement en espèces a été refusé ({m}).',{m})});save();closeSheet();render();toast(t('rj.done','{w} a été prévenu.',{w:first(x.p)}));break}
    case 'rtp':{const g=G(gid);log(g,'log.rtp',{who:P(pid).name},'warn');Services.notify.send({to:P(pid).phone,channel:'sms',text:t('sms.request','TONTI : demande de paiement de {amt} pour « {g} ».',{amt:money(due(g),g.cur),g:g.name})});save();closeSheet();render();toast(t('rtp.done','Demande renvoyée à {w}.',{w:first(pid)}));break}
    case 'cashIn':{const g=G(gid);closeSheet();await loading([t('ld.rec','Enregistrement'),t('ld.receipt','Émission du reçu')],1000);
      const e=g.rounds[g.round].pay[pid];if(['ok','cover','submitted','pending'].includes(e.s)){toast(t('pay.dup','Cette cotisation est déjà enregistrée.'));break}
      const tx=recordTx({kind:'contrib',gid:g.id,r:g.round,p:pid,amount:g.amount,fee:fee(g),cur:g.cur,rail:'cash',acct:'cash',st:'success',ref:refFor('cash'),by:S.me});applyTx(tx);
      bump(pid,daysBetween(dueDate(g,g.round),TODAY)<=0?1:-3);log(g,'log.cashok',{who:P(pid).name},'ok');save();render();toast(t('cf.ok','{w} : paiement confirmé.',{w:first(pid)}));break}
    case 'med':{const g=G(gid);g.rounds[g.round].pay[pid].med=true;log(g,'log.med',{who:P(pid).name},'warn');save();closeSheet();render();toast(t('md.on','Médiation ouverte.'));break}
    case 'cover':{const g=G(gid);closeSheet();await loading([t('ld.prot','Activation de la protection'),t('ld.fund','Mise à jour du fonds')],1200);
      const ok=coverMember(g,pid,b.dataset.how);render();toast(ok?t('cv.ok','Couvert. La levée sera complète.'):t('cv.no','Impossible : protection insuffisante.'));break}
    case 'payout':payoutSheet(gid,false);break;
    case 'partial':payoutSheet(gid,true);break;
    case 'doPayout':{if(busy)return;busy=true;const g=G(gid),to=g.order[g.round];closeSheet();
      await loading([t('ld.transfer','Virement {r}',{r:railName(g.rail)}),t('ld.credit','Crédit du compte de {w}',{w:first(to)}),t('ld.next','Ouverture du tour suivant')],1900);
      const res=doPayoutDomain(g,b.dataset.partial==='1');busy=false;render();
      if(res.err)toast(t('po.dup','Levée déjà versée ou collecte incomplète.'));else if(res.tx.st!=='success')toast(t('po.fail','Échec du virement. Rien n’a été versé ; réessayez.'));
      else toast(t('po.ok','{a} envoyés à {w}.',{a:money(res.tx.amount,g.cur),w:first(to)}));break}
    case 'repay':{const g=G(gid);repayDebt(g,pid);closeSheet();render();toast(t('rp.ok','Remboursement enregistré.'));break}
    case 'pact':pactSheet(gid);break;
    case 'invite':inviteSheet(gid);break;
    case 'copy':copyText($('#inv-msg').textContent,$('#inv-msg'));break;
    case 'copyRef':copyText(b.dataset.ref);break;
    case 'mediate':mediateSheet(gid);break;
    case 'mMotif':selectOne(b);break;
    case 'doMediate':{const g=G(gid);log(g,'log.arr',{who:P(S.me).name},'gold');Services.notify.send({to:P(g.treasurer).phone,channel:'whatsapp',text:t('sms.arr','TONTI : {w} demande un arrangement pour « {g} ».',{w:P(S.me).name,g:g.name})});save();closeSheet();render();toast(t('md.sent','Envoyé à {w}.',{w:first(g.treasurer)}));break}
    case 'attest':attestSheet(gid,pid);break;
    case 'contact':contactSheet(pid);break;
    case 'alerts':alertsSheet();break;
    case 'acct':P(S.me).acct=b.dataset.k;save();render();toast(t('pf.acctset','Compte : {a}.',{a:acctName(b.dataset.k)}));break;
    case 'big':S.big=!S.big;save();render();break;
    case 'setLang':setLang(b.dataset.l);render();break;
    case 'verify':verifySheet();break;
    case 'doverify':{const num=$('#v-num'),ph=$('#v-photo'),er=$('#v-err');
      if(num.value.replace(/\s/g,'').length<6){er.textContent=t('vf.short','Numéro trop court.');er.hidden=false;return}
      if(!ph.files.length){er.textContent=t('vf.photo','Ajoutez un selfie avec la pièce.');er.hidden=false;return}
      closeSheet();await loading([t('ld.secure','Envoi sécurisé'),t('ld.check','Contrôle du document')],1600);
      const res=Services.identity.submit({person:S.me,country:P(S.me).cc});const me=P(S.me);me.v.id=res.status;
      if(res.status==='verified')bump(S.me,20);save();render();
      toast(res.status==='verified'?t('vf.ok','Identité vérifiée.'):res.status==='pending'?t('vf.pend','Revue manuelle en cours.'):t('vf.rej','Refusé : document illisible.'));break}
    case 'idResolve':P(S.me).v.id='verified';bump(S.me,20);save();render();toast(t('vf.ok','Identité vérifiée.'));break;
    case 'demoSet':DEMO[b.dataset.k]=b.dataset.v;saveDemo();render();break;
    case 'time':{const n=+b.dataset.n;setOffset(n===0?0:(S.dayOffset||0)+n);render();toast(dDay(TODAY));break}
    case 'demoGo':{const k=b.dataset.kind,arg=b.dataset.arg;
      if(k==='home')go('home');else if(k==='pay'){if(gid)0;const g=G(arg);if(arg==='g4'){DEMO.pay='refused';saveDemo()}else{DEMO.pay='success';saveDemo()}go('group',{gid:arg});setTimeout(()=>paySheet(arg),200)}
      else if(k==='group')go('group',{gid:arg});else if(k==='member'){const [g,p]=arg.split(':');go('group',{gid:g});setTimeout(()=>memberSheet(g,p),200)}
      else if(k==='protect')go('protect',{gid:arg,from:'profile'});else if(k==='join'){go('tontines');setTimeout(joinSheet,200)}else if(k==='profile')go('profile');else if(k==='legal')go('legal',{doc:arg});else if(k==='voice'){vset().lang='bm';save();go('profile');setTimeout(assistantSheet,250)}break}
    case 'reset':{const me=P(S.me),cons=S.consents,big=S.big;S={voice:S.voice,consents:cons,big};seed(me.name,me.phone,me.cc);S.consents=cons;S.big=big;save();await loading([t('ld.demo','Chargement des exemples')],900);go('home');toast(t('demo.resetok','Démonstration réinitialisée.'));break}
    case 'wipe':{const me=P(S.me);S={voice:S.voice,v:5,me:'me',people:{me:{...me,score:60,v:{id:'none',tel:true}}},groups:[],tx:[],outbox:[],consents:S.consents,demo:false,account:true,notifSeen:true,big:S.big,dayOffset:0};TODAY=new Date(BASE);save();go('home');toast(t('demo.wiped','Tout est effacé.'));break}
    case 'logout':S.account=false;save();ob={step:'welcome',slide:0,mode:null,name:'',phone:'',cc:P(S.me).cc||'ML',err:'',consent:{cgu:false,priv:false,demo:false},otpSent:null};render();window.scrollTo(0,0);break;
    case 'replay':await splash();break;
    /* onboarding */
    case 'obLang':setLang(b.dataset.l);render();break;
    case 'obLangNext':ob.step='welcome';render();break;
    case 'obToLang':ob.step='lang';render();break;
    case 'slide':ob.slide=+b.dataset.i;render();break;
    case 'obStart':ob.mode=b.dataset.mode;ob.step='phone';ob.err='';render();break;
    case 'obBack':ob.step=ob.step==='otp'?'phone':'welcome';ob.err='';render();break;
    case 'obConsent':{const nm=$('#ob-name'),ph=$('#ob-phone');if(nm)ob.name=nm.value;if(ph)ob.phone=ph.value;ob.consent[b.dataset.k]=!ob.consent[b.dataset.k];render();break}
    case 'obPhone':{const nm=$('#ob-name'),ph=$('#ob-phone');ob.name=nm?nm.value.trim():'';ob.phone=fmtPhone(ph.value);
      if(ob.mode==='signup'&&ob.name.length<3){ob.err=t('ob.errname','Indiquez votre nom complet.');return render()}
      if(!phoneOk(ob.phone,ob.cc)){ob.err=t('ob.errphone','Numéro invalide pour ce pays ({n} chiffres).',{n:COUNTRIES[ob.cc].len.join('–')});return render()}
      if(ob.mode==='signup'&&!(ob.consent.cgu&&ob.consent.priv&&ob.consent.demo)){ob.err=t('ob.errcons','Cochez les trois cases pour continuer.');return render()}
      ob.err='';await loading([t('ld.sms','Envoi du code par SMS')],1000);ob.otpSent=Services.sms.sendOtp('+'+COUNTRIES[ob.cc].dial+ob.phone);ob.step='otp';render();setTimeout(()=>$('#ob-otp')?.focus(),50);break}
    case 'obResend':ob.otpSent=Services.sms.resend();ob.err='';render();toast(t('ob.resent','Nouveau code envoyé.'));break;
    case 'obOtp':{const v=$('#ob-otp').value.trim(),res=Services.sms.verifyOtp('',v);
      if(!res.ok){ob.err=res.reason==='expired'?t('ob.errexp','Code expiré. Demandez un nouveau code.'):t('ob.errcode','Code incorrect.');return render()}
      await loading([t('ld.code','Vérification du code'),t('ld.space','Création de votre espace'),t('ld.alias','Liaison de votre alias de paiement')],2100);
      const prev=load(),phone='+'+COUNTRIES[ob.cc].dial+' '+ob.phone;
      if(ob.mode==='login'&&prev&&prev.groups&&prev.v===5){S=prev;S.account=true;TODAY=addDays(BASE,S.dayOffset||0)}
      else{const cons=[];if(ob.mode==='signup')['cgu','privacy','demo'].forEach(d=>cons.push({doc:d,ver:LEGAL_VER,d:iso(BASE),t:nowT()}));const vv=S&&S.voice;S={voice:vv};seed(ob.mode==='signup'?ob.name:null,phone,ob.cc);S.consents=cons}
      save();go('home');toast(ob.mode==='signup'?t('ob.hi','Bienvenue, {n} !',{n:first(S.me)}):t('ob.in','Connexion réussie.'));break}
    /* création */
    case 'cback':syncDraft();draft.err='';if(draft.step>1){draft.step--;render()}else{draft=null;go('tontines')}break;
    case 'cset':{syncDraft();const k=b.dataset.k,v=b.dataset.v;draft[k]=['amount','caution','fundPct','gFirst'].includes(k)?+v:v;render();break}
    case 'ctoggle':{syncDraft();const i=draft.members.indexOf(pid);i>=0?draft.members.splice(i,1):draft.members.push(pid);render();break}
    case 'cadd':{syncDraft();const nm=draft.newName.trim(),ph=fmtPhone(draft.newPhone);
      if(nm.length<3||!phoneOk(ph,draft.cc)){draft.err=t('c.erradd','Indiquez un nom et un numéro valide.');return render()}
      const id='p'+uid();S.people[id]={id,name:nm,phone:'+'+COUNTRIES[draft.cc].dial+' '+ph,score:60,q:'',acct:COUNTRIES[draft.cc].acc[0],cc:draft.cc,v:{id:'none',tel:false}};draft.members.push(id);draft.newName=draft.newPhone='';draft.err='';save();render();toast(t('c.added','{n} ajouté.',{n:nm}));break}
    case 'cid':draft.idReq=!draft.idReq;render();break;
    case 'cpact':draft.pact=!draft.pact;draft.err='';render();break;
    case 'cnext':{syncDraft();const d=draft,c=CUR[COUNTRIES[d.cc].cur];d.err='';
      if(d.step===1){if(d.name.length<3)d.err=t('c.errname','Donnez un nom (3 lettres minimum).');else if(d.amount<c.min)d.err=t('c.errmin','Minimum {m}.',{m:money(c.min,COUNTRIES[d.cc].cur)});else if(c.cap&&d.amount>c.cap)d.err=t('c.errcap','Au-dessus du plafond {r} ({m}).',{r:railName(COUNTRIES[d.cc].rail),m:money(c.cap,COUNTRIES[d.cc].cur)})}
      if(d.step===2&&d.members.length<3)d.err=t('c.errmem','Il faut au moins 3 membres.');
      if(d.step===4&&!d.pact)d.err=t('c.errpact','Acceptez le pacte pour continuer.');
      if(d.err)return render();if(d.step<4){d.step++;render();window.scrollTo(0,0)}else createGroup();break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function openLegal(doc){const [title,secs]=legalDoc(doc);const fb=!['fr','en','bm','wo'].includes(LANG);
  sheet(`<h2>${esc(title)}</h2><div class="draft" style="margin-top:8px">${I(IC.alert,20)}<span>${t('lg.draft','PROJETS v{v} — à valider par un juriste avant toute mise en production.',{v:LEGAL_VER})}</span></div>
    <article class="doc" style="margin-top:6px" ${fb?'lang="en" dir="ltr"':''}>${secs.map(([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}</article>
    <button class="btn block" style="margin-top:14px" data-act="close">${t('a.close','Fermer')}</button>`)}

/* ===== Chargement + ouverture ===== */
(function seats(){let s='';for(let k=0;k<12;k++){const a=k/12*Math.PI*2-Math.PI/2;s+=`<circle class="seat" cx="${(100+86*Math.cos(a)).toFixed(2)}" cy="${(100+86*Math.sin(a)).toFixed(2)}" r="3.4"/>`}$('#seats').innerHTML=s})();
let seatTimer=null;
function runSeats(){let k=0;const all=[...document.querySelectorAll('#seats .seat')];clearInterval(seatTimer);
  const tick=()=>{all.forEach((c,i)=>{c.classList.toggle('done',i<k);c.classList.toggle('now',i===k)});k=(k+1)%13};tick();seatTimer=setInterval(tick,140)}
function loading(texts,ms,overlay=true){
  texts=[].concat(texts);const Lr=$('#loader'),tx=$('#ldText'),sub=$('#ldSub'),bar=$('#ldBar');
  Lr.classList.toggle('overlay',overlay);Lr.classList.remove('out');Lr.hidden=false;runSeats();
  tx.textContent=texts[0];sub.textContent=overlay?t('ld.sub','Simulation sécurisée'):'TONTI';bar.style.transition='none';bar.style.width='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition='width '+ms+'ms cubic-bezier(.3,.1,.3,1)';bar.style.width='100%'}));
  const step=ms/texts.length;texts.forEach((x,i)=>{if(i)setTimeout(()=>{tx.style.opacity=0;setTimeout(()=>{tx.textContent=x;tx.style.opacity=1},200)},step*i)});
  return new Promise(res=>setTimeout(()=>{Lr.classList.add('out');setTimeout(()=>{Lr.hidden=true;clearInterval(seatTimer);res()},400)},ms+150));
}
function splash(){const sp=$('#splash'),clone=sp.cloneNode(true);sp.replaceWith(clone);clone.classList.remove('out');
  return new Promise(res=>{let done=false;const end=()=>{if(done)return;done=true;clone.classList.add('out');res()};clone.onclick=end;setTimeout(end,matchMedia('(prefers-reduced-motion: reduce)').matches?500:2700)})}
async function boot(){
  try{const l=localStorage.getItem('tonti.lang');if(l&&LANGS[l]){LANG=l;ob.step='welcome'}else{const nl=(navigator.language||'fr').slice(0,2);if(LANGS[nl])LANG=nl}}catch(e){}
  S=load();if(!S||S.v!==5)S={account:false};else TODAY=addDays(BASE,S.dayOffset||0);
  applyLang();render();await splash();
  await loading([t('ld.space1','Chargement de votre espace'),t('ld.sec','Vérification de la sécurité'),t('ld.sync','Synchronisation')],2000,false);
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
