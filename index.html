<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TONTI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0F5132">
<meta name="description" content="TONTI — tontines protégées, en plusieurs langues et devises. Version de démonstration.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>

/* Layout: "Élégance Sahélienne Moderne", visual-first. One phone column (max 440px); every screen leads with one picture (turn wheel, cowrie pot, bead timeline, countdown ring) and one big action; text is short and paired with an icon. Payments run on PI-SPI. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface-2:#EFF5F0; --sand:#EAD9C4; --sand-soft:#F6EFE5;
  --ghost:rgba(15,81,50,.09); --line:rgba(37,43,40,.08);
  --ink:#252B28; --muted:#5D6561; --faint:#8A918D;
  --primary:#0F5132; --primary-press:#0B3D26; --deep:#003820; --secondary:#1F7A4D; --pill:#BFEBD0; --on-pill:#0F5132;
  --ok:#0F5132; --ok-soft:#E8F3ED; --gold:#C9A227; --gold-ink:#8C6D13; --gold-soft:#FAF4E3;
  --warn:#C2410C; --warn-soft:#FFF1E8; --bad:#991B1B; --bad-soft:#FEF2F2;
  --wm:#0F5132; --seat:#E6ECE7; --seat-ink:#5D6561;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --float:0 4px 16px -2px rgba(15,81,50,.06),0 2px 6px -1px rgba(37,43,40,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1B2620; --sand:#3A3428; --sand-soft:#24221C;
  --ghost:rgba(149,212,172,.10); --line:rgba(236,242,237,.08);
  --ink:#E9EEEA; --muted:#A5AEA8; --faint:#78827C;
  --primary:#2D8A5C; --primary-press:#24744C; --deep:#0B3A26; --secondary:#5CC08D; --pill:#1E4A33; --on-pill:#B6EDCB;
  --ok:#6BCB98; --ok-soft:#163222; --gold:#D9B444; --gold-ink:#E6C766; --gold-soft:#2E2812;
  --warn:#F39A5B; --warn-soft:#3A2416; --bad:#F08A80; --bad-soft:#3A1E1C; --wm:#EEF2EE; --seat:#24302A; --seat-ink:#A5AEA8;
  --float:0 4px 16px -2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1B2620; --sand:#3A3428; --sand-soft:#24221C;
  --ghost:rgba(149,212,172,.10); --line:rgba(236,242,237,.08);
  --ink:#E9EEEA; --muted:#A5AEA8; --faint:#78827C;
  --primary:#2D8A5C; --primary-press:#24744C; --deep:#0B3A26; --secondary:#5CC08D; --pill:#1E4A33; --on-pill:#B6EDCB;
  --ok:#6BCB98; --ok-soft:#163222; --gold:#D9B444; --gold-ink:#E6C766; --gold-soft:#2E2812;
  --warn:#F39A5B; --warn-soft:#3A2416; --bad:#F08A80; --bad-soft:#3A1E1C; --wm:#EEF2EE; --seat:#24302A; --seat-ink:#A5AEA8;
  --float:0 4px 16px -2px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
html.lg body{zoom:1.14}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--secondary);outline-offset:2px;border-radius:10px}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app.bare{padding-bottom:24px}
.num,.amt{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* Wordmark */
.wm{display:block;height:auto;color:var(--wm);overflow:visible}
.wm .dot{fill:#D49737}

/* Splash */
.splash{position:fixed;inset:0;z-index:100;background:#F8F6F0;display:grid;place-items:center;transition:opacity .6s ease,visibility .6s;overflow:hidden}
.splash.out{opacity:0;visibility:hidden}
.splash .pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.splash-in{position:relative;display:grid;justify-items:center;gap:20px;width:min(76vw,330px)}
.splash .wm{width:100%;color:#0F5132}
.splash .wm g,.splash .wm use,.splash .wm circle{transform-box:fill-box;transform-origin:center}
.splash .g-t1{animation:wmIn .7s .55s cubic-bezier(.2,.8,.2,1) both;--dx:-18px}
.splash .g-n{animation:wmIn .7s .7s cubic-bezier(.2,.8,.2,1) both;--dx:18px}
.splash .g-t2{animation:wmIn .7s .8s cubic-bezier(.2,.8,.2,1) both;--dx:18px}
.splash .g-i{animation:wmIn .7s .9s cubic-bezier(.2,.8,.2,1) both;--dx:18px}
.splash .g-cw{animation:cwIn 1.1s cubic-bezier(.3,.7,.2,1) both}
.splash .dot{animation:dotIn .5s 1.3s cubic-bezier(.3,1.5,.5,1) both}
.splash .tag{font:600 15px/1.4 var(--f);color:#3E4A44;text-align:center;animation:fadeUp .7s 1.5s both}
.splash .rule{width:40px;height:2px;background:#C9A227;animation:grow .6s 1.4s both}
.splash .foot{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7A857E;animation:fadeUp .6s 1.7s both}
@keyframes wmIn{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
@keyframes cwIn{0%{opacity:0;transform:translateY(-14%) rotate(-24deg) scale(.82)}55%{opacity:1}100%{transform:none}}
@keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,39,.55)}50%{box-shadow:0 0 0 7px rgba(201,162,39,0)}}

/* Loader */
.loader{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#F8F6F0;transition:opacity .4s ease,visibility .4s}
.loader.overlay{background:rgb(246 247 245 / .95);backdrop-filter:blur(8px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .loader.overlay{background:rgb(14 20 17 / .92)}}
:root[data-theme="dark"] .loader.overlay{background:rgb(14 20 17 / .92)}
.loader.out{opacity:0;visibility:hidden}
.loader[hidden]{display:none!important}
.ld{display:grid;justify-items:center;gap:24px;text-align:center}
.orbit{position:relative;width:200px;height:200px}
.orbit svg.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit .r-gold{transform-origin:100px 100px;animation:spin 1.8s linear infinite}
.orbit .r-green{transform-origin:100px 100px;animation:spin 3.6s linear infinite reverse}
.orbit .r-ticks{transform-origin:100px 100px;animation:spin 24s linear infinite}
.orbit .seat{fill:#DCCDB6;transition:fill .3s}
.orbit .seat.done{fill:#0F5132}.orbit .seat.now{fill:#C9A227}
.orbit .cw{position:absolute;left:50%;top:50%;width:62px;margin:-39px 0 0 -31px;animation:breathe 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgb(60 40 10 / .22))}
.orbit .cw img{display:block;width:100%}
.orbit .sheen{position:absolute;left:50%;top:50%;width:62px;height:78px;margin:-39px 0 0 -31px;-webkit-mask:var(--cw-mask) center/contain no-repeat;mask:var(--cw-mask) center/contain no-repeat;animation:breathe 2.4s ease-in-out infinite;overflow:hidden}
.orbit .sheen::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgb(255 255 255 / .75) 50%,transparent 60%);animation:sheen 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes sheen{0%,35%{transform:translateX(-60%)}75%,100%{transform:translateX(60%)}}
.ld-text{min-height:22px;font-weight:700;font-size:15px;color:#252B28;transition:opacity .25s}
.ld-sub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A857E;margin-top:-16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .loader.overlay .ld-text{color:#E9EEEA}}
:root[data-theme="dark"] .loader.overlay .ld-text{color:#E9EEEA}
.ld-bar{width:160px;height:3px;border-radius:3px;background:#E4DACB;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:#0F5132;border-radius:3px}

/* Header / nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;min-height:62px}
.top h1{font-size:21px;font-weight:800;margin:0;flex:1;min-width:0;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:13px;color:var(--muted)}
.ibtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn.solid{background:var(--surface);box-shadow:inset 0 0 0 1px var(--ghost)}
.ibtn .badge{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#D97706;box-shadow:0 0 0 2px var(--bg)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);box-shadow:0 -1px 0 var(--line),var(--float);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav[hidden]{display:none}
.nav-in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{display:grid;justify-items:center;gap:3px;padding:7px 0 6px;font-size:12px;font-weight:700;color:var(--muted);border-radius:18px;transition:background .2s}
.nav button[aria-current="page"]{color:var(--on-pill);background:var(--pill)}
.nav svg{width:25px;height:25px}

/* Blocks */
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.stack>*,.card>*,.inset>*,.sheet>*{min-width:0}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--ghost);padding:16px;min-width:0}
.inset{background:var(--surface-2);border-radius:14px;padding:12px 14px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px -2px}
.sec-h h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.link{font-size:14px;font-weight:700;color:var(--secondary);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.caps{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.amt{font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.amt small{font-size:.55em;font-weight:700;letter-spacing:0;margin-left:4px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 18px;border-radius:16px;font-weight:800;font-size:16px;background:var(--primary);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:var(--primary-press)} .btn:active{transform:scale(.99)}
.btn.xl{min-height:64px;font-size:18px;border-radius:18px}
.btn.outline{background:transparent;color:var(--secondary);box-shadow:inset 0 0 0 1.5px var(--secondary)}
.btn.sand{background:var(--sand-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ghost)}
.btn.sand:hover{background:var(--sand)}
.btn.danger{background:var(--surface);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad-soft)}
.btn.gold{background:linear-gradient(180deg,#C9A227,#B38F1E);color:#fff}
.btn.white{background:#fff;color:#0F5132}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;line-height:1.15}
.chip svg{flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.chip.sm{padding:2px 8px;font-size:11px}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--ok-soft);color:var(--primary);position:relative}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{color:var(--ok)}}
:root[data-theme="dark"] .av{color:var(--ok)}
.av.me{background:var(--primary);color:#fff}
.av .tick{position:absolute;right:-2px;bottom:-2px;width:17px;height:17px;border-radius:50%;background:var(--secondary);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;min-width:0}
.row + .row{border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{white-space:normal}
.lbtn{width:100%;text-align:left}
.ricon{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ricon{color:var(--ok)}}
:root[data-theme="dark"] .ricon{color:var(--ok)}
.ricon.gold{background:var(--gold-soft);color:var(--gold-ink)}
.ricon.sm{width:36px;height:36px;border-radius:10px}
.demo{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);border:1px dashed var(--sand);border-radius:12px;padding:9px 12px}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:10px;background:var(--primary)}

/* Status badge with big icon */
.sbig{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.sbig .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}

/* Next action hero */
.hero{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(160deg,#0F5132,#003820);display:grid;gap:14px;position:relative;overflow:hidden}
.hero.late{background:linear-gradient(160deg,#9B2C1F,#5C1410)}
.hero.done{background:linear-gradient(160deg,#1F7A4D,#0F5132)}
.hero .deco{position:absolute;right:-50px;top:-50px;width:200px;height:200px;opacity:.12;pointer-events:none}
.hero .hd{display:flex;align-items:center;gap:14px;position:relative}
.hero .k{font-size:14px;font-weight:700;color:rgb(255 255 255 / .8);display:flex;align-items:center;gap:6px}
.hero .big{font-size:clamp(28px,9.4vw,38px);font-weight:800;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .big small{font-size:16px;font-weight:700;margin-left:6px;color:rgb(255 255 255 / .75)}
.hero .g{font-size:14px;color:rgb(255 255 255 / .82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .btn{position:relative}
.cd{position:relative;width:84px;height:84px;flex:none}
.cd svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.cd .v b{font-size:28px;font-weight:800}
.cd .v span{font-size:11px;font-weight:700;opacity:.85;margin-top:3px}
.listen{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px;background:rgb(255 255 255 / .12);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .2);color:#fff}

/* Turn wheel */
.wheel{position:relative;width:min(100%,280px);aspect-ratio:1;margin:0 auto;max-width:100%}
.wheel svg{width:100%;height:100%;overflow:visible;display:block}
.wheel .center{position:absolute;inset:27%;display:grid;place-content:center;text-align:center;gap:2px}
.wheel .center img{width:38px;margin:0 auto 2px;filter:drop-shadow(0 4px 5px rgb(60 40 10 / .25))}
.wheel .center b{font-size:22px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.wheel .center span{font-size:12px;font-weight:700;color:var(--muted)}
.wheel.sm{width:min(100%,200px)}
.wheel.sm .center b{font-size:17px}.wheel.sm .center img{width:28px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}

/* Cowrie pot */
.pot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 6px}
.pot .c{display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative}
.pot .c .s{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);position:relative}
.pot .c img{width:26px;transition:filter .3s,opacity .3s}
.pot .c.off img{filter:grayscale(1);opacity:.3}
.pot .c.ok .s{background:var(--ok-soft)}
.pot .c.sub .s{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)}
.pot .c.late .s{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.pot .c.ben .s{box-shadow:inset 0 0 0 2.5px var(--gold)}
.pot .c .m{position:absolute;top:-3px;right:calc(50% - 27px);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px var(--surface)}
.pot .c span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Bead timeline */
.beads{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:6px 2px 4px;scroll-snap-type:x proximity}
.beads::-webkit-scrollbar{display:none}
.bead{flex:none;width:66px;display:grid;justify-items:center;gap:5px;position:relative;scroll-snap-align:center}
.bead::before{content:"";position:absolute;top:22px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.bead:first-child::before{display:none}
.bead.done::before,.bead.now::before{background:var(--primary)}
.bead .o{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);color:var(--faint);position:relative;z-index:1}
.bead.done .o{background:var(--primary);color:#fff;box-shadow:none}
.bead.now .o{background:var(--gold);color:#fff;box-shadow:none;animation:pulse 2s infinite}
.bead.mine .o{box-shadow:inset 0 0 0 3px var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.bead.mine.done .o{background:var(--primary);color:#fff}
.bead .d{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.bead .w{font-size:11px;font-weight:800;color:var(--ink);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bead.mine .w{color:var(--gold-ink)}
.bead .tag{position:absolute;top:-6px;right:6px;z-index:2;background:var(--gold);color:#fff;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 5px}

/* Tontine card */
.tc{display:grid;gap:12px;width:100%}
.tc .hd{display:flex;align-items:center;gap:10px}
.tc .nm{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.tc .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:4px;justify-items:center;text-align:center;min-width:0}
.fact .fi{color:var(--secondary)}
.fact b{font-size:15px;font-weight:800;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.fact span{font-size:11.5px;font-weight:700;color:var(--muted)}
.fact.gold{background:var(--gold-soft)} .fact.gold .fi{color:var(--gold-ink)}
.fact.bad{background:var(--bad-soft)} .fact.bad .fi,.fact.bad b{color:var(--bad)}

.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.duo .btn{min-height:58px;font-size:15px;padding:0 12px}
.tiles2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--ghost);border-radius:16px;padding:14px;display:grid;gap:6px;min-width:0}
.tile .amt{font-size:20px}

/* Tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ghost)}
.tabs button[aria-selected="true"]{background:var(--primary);color:#fff;box-shadow:none}

/* PI-SPI */
.spi{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spi{color:var(--ok)}}
:root[data-theme="dark"] .spi{color:var(--ok)}
.spi .lg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#0F5132,#1F7A4D);color:#fff}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.how div{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.how .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .how .n{color:var(--ok)}}
:root[data-theme="dark"] .how .n{color:var(--ok)}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.acc button{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(37,43,40,.14)}
.acc button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--primary);background:var(--ok-soft)}
.dotm{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.phone{width:150px;height:230px;border-radius:26px;background:#1B2420;padding:10px;margin:4px auto;box-shadow:0 18px 30px -18px rgba(0,0,0,.6)}
.phone .scr{height:100%;border-radius:18px;background:#fff;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:10px;color:#252B28}
.phone .scr b{font-size:16px;font-weight:800}
.phone .pin{display:flex;gap:6px}.phone .pin i{width:10px;height:10px;border-radius:50%;background:#D9DED9;animation:pin 1.6s infinite}
.phone .pin i:nth-child(2){animation-delay:.2s}.phone .pin i:nth-child(3){animation-delay:.4s}.phone .pin i:nth-child(4){animation-delay:.6s}
@keyframes pin{0%,30%{background:#D9DED9}50%,100%{background:#0F5132}}
.okbig{width:96px;height:96px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:6px auto 0;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.qrbox{width:212px;height:212px;margin:0 auto;padding:12px;background:#fff;border-radius:18px;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px rgba(37,43,40,.1)}
.qrbox img,.qrbox canvas{width:188px!important;height:188px!important}
.qrbox .ctr{position:absolute;width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}
.qrbox .ctr img{width:28px!important;height:auto!important}

/* Receipts */
.receipt{border-radius:18px;border:1px dashed var(--sand);padding:16px;display:grid;gap:12px;background:var(--sand-soft)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.02em}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--surface);box-shadow:inset 0 0 0 1px var(--ghost);color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--pill);color:var(--on-pill);box-shadow:none}

/* Protection */
.ph{background:linear-gradient(140deg,var(--surface) 55%,var(--gold-soft));display:grid;gap:12px}
.ph h2{font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.015em;margin:0}
.metric{display:grid;gap:10px}
.metric .mh{display:flex;align-items:flex-start;gap:10px}
.metric .val{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ladder{display:grid;gap:10px}
.rung{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.rung h3{margin:0;font-size:15px;font-weight:800}
.rung p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rung .st{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.cta{background:linear-gradient(160deg,#0F5132,#003820);color:#fff;border-radius:var(--r);padding:18px 16px;display:grid;gap:14px}
.cta p{margin:2px 0 0;font-size:13px;color:rgb(255 255 255 / .8)}
.gcard{border-radius:14px;padding:14px;background:var(--surface-2);display:grid;gap:12px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font-size:20px;font-weight:800;line-height:1}
.ring .rv span{font-size:10.5px;color:var(--muted)}

/* Onboarding */
.ob{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);padding-block:22px 18px;gap:18px}
.ob-hero{position:relative;border-radius:24px;overflow:hidden;background:var(--sand-soft);min-height:250px;display:grid;place-items:center}
.ob-hero svg.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.ob-hero .seats{position:absolute;inset:0;width:100%;height:100%}
.ob h2{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0;text-align:center;text-wrap:balance}
.ob p{margin:8px auto 0;text-align:center;color:var(--muted);max-width:32ch;font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots button{width:8px;height:8px;border-radius:8px;background:var(--sand);transition:width .2s}
.dots button[aria-current="true"]{width:22px;background:var(--primary)}
.ob-actions{display:grid;gap:10px}
.h-big{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0}

/* Forms */
label.f,.f{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;min-width:0;min-height:54px;border-radius:14px;border:1px solid rgba(37,43,40,.16);background:var(--surface);padding:0 14px;font-size:16px}
textarea.inp{min-height:96px;padding:12px 14px;resize:vertical}
.inp:focus{outline:none;border:1.5px solid var(--primary);box-shadow:0 0 0 4px rgba(15,81,50,.06)}
.inp.otp,.inp.code{text-align:center;letter-spacing:.4em;font-size:24px;font-weight:800;text-transform:uppercase}
.pre{display:flex;gap:8px}.pre .inp{flex:1;width:auto}.pre .cc{flex:none;min-height:54px;padding:0 12px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--ink)}
.suffix{position:relative}.suffix .inp{padding-right:64px;font-weight:800}.suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--faint);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;min-height:46px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(37,43,40,.14);font-weight:700;font-size:13.5px;padding:4px 8px;color:var(--ink);text-align:center}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--primary);background:var(--ok-soft);color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:var(--ok)}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:var(--ok)}
.switch-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);box-shadow:inset 0 0 0 1px rgba(37,43,40,.12);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--primary)}.sw[aria-checked="true"]::after{transform:translateX(20px)}
.progress{display:flex;gap:6px}.progress i{flex:1;height:5px;border-radius:5px;background:var(--line)}.progress i.on{background:var(--primary)}
.check{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(37,43,40,.2);display:grid;place-items:center;flex:none}
.check.on{background:var(--primary);box-shadow:none;color:#fff}
.err{color:var(--bad);font-size:13.5px;font-weight:700;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}

/* Sheet + toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgb(37 43 40 / .6);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:440px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(37,43,40,.14);text-align:left}
.opt:hover{background:var(--surface-2)}
.opt b{display:block;font-size:15px}
.opt span{display:block;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:95;transform:translate(-50%,16px);opacity:0;background:#252B28;color:#F6F7F5;
  padding:12px 16px;border-radius:14px;font-weight:700;font-size:14.5px;width:max-content;max-width:min(400px,calc(100% - 32px));transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---- v1.4 additions: international, demo mode, legal, voice ---- */
.hero{grid-template-columns:minmax(0,1fr)}.hero>*,.hero .hd>*{min-width:0}.spi{white-space:nowrap}
.lsn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sand-soft);color:var(--primary);flex:none;box-shadow:inset 0 0 0 1px var(--ghost)}
.hero .lsn{background:rgb(255 255 255 / .14);color:#fff;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .2)}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:96;width:min(420px,calc(100% - 24px));background:#15211B;color:#F6F7F5;border-radius:18px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.player[hidden]{display:none!important}
.player .wave{display:flex;gap:3px;align-items:center;height:22px;flex:none}
.player .wave i{width:3px;height:6px;border-radius:2px;background:#C9A227;animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:20px}}
.player .tx{font-size:14.5px;line-height:1.45;max-height:7em;overflow:auto}
.player .md{font-size:12px;font-weight:700;color:#EDCB62;min-width:0}
.mic{width:104px;height:104px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;margin:6px auto;box-shadow:0 0 0 12px var(--ok-soft)}
.mic.on{animation:pulse 1.6s infinite;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(37,43,40,.14);font-weight:700;font-size:14px;text-align:start}
.chips button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--primary);background:var(--ok-soft)}
.ans{border-radius:18px;padding:16px;background:var(--surface-2);display:grid;gap:10px}
:root[lang="ar"] body{font-family:"Noto Sans Arabic",var(--f)}
[dir="rtl"] svg.fl{transform:scaleX(-1)}
[dir="rtl"] .bead::before{left:auto;right:-50%}
.lbtn,.opt{text-align:start}
.demochip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:5px 8px;border-radius:8px;color:#fff;flex:none;
  background:repeating-linear-gradient(45deg,#B8901C,#B8901C 6px,#A07C14 6px,#A07C14 12px)}
.wmark{position:relative;overflow:hidden}
.wmark::after{content:attr(data-wm);position:absolute;left:-20%;right:-20%;top:42%;text-align:center;transform:rotate(-18deg);font-size:30px;font-weight:800;letter-spacing:.2em;color:rgba(153,27,27,.11);pointer-events:none}
.langs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.langs button{min-height:68px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--ghost);font-weight:800;font-size:17px;display:grid;align-content:center;justify-items:start;padding:10px 14px;text-align:start;gap:2px}
.langs button span{font-size:12px;color:var(--muted);font-weight:600}
.langs button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--primary);background:var(--ok-soft)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:36px}
[dir="rtl"] select.inp{background-position:20px 50%,14px 50%}
.doc{display:grid;gap:4px}
.doc h3{font-size:16px;font-weight:800;margin:14px 0 2px}
.doc p,.doc li{font-size:14.5px;line-height:1.6;margin:0}
.doc ul{margin:4px 0;padding-inline-start:20px;display:grid;gap:4px}
.draft{display:flex;gap:10px;align-items:center;border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:13.5px}
.scn{display:grid;gap:8px}
.scn button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(37,43,40,.14);font-weight:700;text-align:start;width:100%}
.scn button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--primary);background:var(--ok-soft)}
.scn button .dotm{width:12px;height:12px}
.step-l{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0}
.step-l + .step-l{border-top:1px solid var(--line)}
.step-l .st{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.failrow .amt{text-decoration:line-through;color:var(--faint)}
.consent{display:flex;gap:12px;align-items:flex-start;padding:10px 0;text-align:start;width:100%}
.consent .check{margin-top:1px}
.consent a,.consent .lnk{color:var(--secondary);font-weight:700;text-decoration:underline}
</style>

<script>
/* ==========================================================================
   TONTI v1.4 — prototype de présentation (Phase 1)
   Structure :
     1. Ressources (logo)
     2. Configuration internationale (langues, pays, devises, réseaux)
     3. Internationalisation (t)
     4. SERVICES — contrats + implémentations SIMULÉES (à remplacer en Phase 3)
     5. DOMAINE — règles métier, registre des transactions (ledger)
     6. Interface
   Rien dans ce fichier ne déplace d’argent réel.

   PaymentService

const DEMO_KEY='tonti.demo';
let DEMO={pay:'success',otp:'normal',id:'verified'};
try{Object.assign(DEMO,JSON.parse(localStorage.getItem(DEMO_KEY)||'{}'))}catch(e){}
const saveDemo=()=>{try{localStorage.setItem(DEMO_KEY,JSON.stringify(DEMO))}catch(e){}};
const refFor=(rail)=>(rail==='pispi'?'SPI':rail==='sepa'?'SCT':rail==='cash'?'ESP-':'TRF')+(rail==='cash'?digits(4):iso(TODAY).slice(2).replace(/-/g,'')+digits(8));

const SimPayments={
  request(req){
    const sc=DEMO.pay;
    if(sc==='success')return {status:'success',ref:refFor(req.rail)};
    if(sc==='pending')return {status:'pending',ref:refFor(req.rail)};
    if(sc==='refused')return {status:'refused',reason:'refused'};
    if(sc==='insufficient')return {status:'insufficient',reason:'insufficient'};
    return {status:'failed',reason:'network'};
  },
  settlePending(tx,approved){return approved?{status:'success',ref:tx.ref}:{status:'expired'}},
  payout(req){
    if(DEMO.pay==='failed')return {status:'failed',reason:'network'};
    return {status:'success',refs:Array.from({length:req.parts},()=>refFor(req.rail))};
  }
};
let OTP={code:null,expired:false};
const SimSms={
  sendOtp(phone){const delivered=DEMO.otp!=='undelivered';OTP={code:delivered?(DEMO.otp==='expired'?'4321':'1234'):null,expired:DEMO.otp==='expired'};
    if(!delivered){DEMO.otp='normal';saveDemo()}return {delivered,code:OTP.code}},
  resend(phone){OTP={code:'1234',expired:false};if(DEMO.otp==='expired'){DEMO.otp='normal';saveDemo()}return {delivered:true,code:OTP.code}},
  verifyOtp(phone,code){if(!OTP.code||code!==OTP.code)return {ok:false,reason:'wrong'};if(OTP.expired)return {ok:false,reason:'expired'};return {ok:true}}
};
const SimIdentity={
  submit(){const sc=DEMO.id;return sc==='verified'?{status:'verified'}:sc==='pending'?{status:'pending'}:{status:'rejected',reason:'unreadable'}}
};
const SimNotify={send(m){S.outbox.unshift({...m,d:iso(TODAY),t:nowT()});S.outbox=S.outbox.slice(0,40);return {queued:true}}};
/* VoiceService (contrat)
     speak({text,lang,pref}) -> {mode:'device'|'simulated'|'provider'}   — synthèse vocale (TTS)
     transcribe({audio,lang}) -> {text,confidence}                         — reconnaissance (ASR) : NON utilisée dans la démo
     translate({text,from,to}) -> {text}                                    — traduction automatique
   Démo : voix de l’appareil quand elle existe (fr, en, es, pt, ar) ; sinon lecture SIMULÉE affichée comme telle. */
const SimVoice={
  hasDevice(lang){const d=SPOKEN[lang]&&SPOKEN[lang].dev;if(!d||!('speechSynthesis' in window))return false;const vs=speechSynthesis.getVoices();return !vs.length||vs.some(v=>v.lang.toLowerCase().startsWith(d.slice(0,2)))},
  speak({text,lang,pref,onend}){
    if(this.hasDevice(lang)){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=SPOKEN[lang].dev;u.rate=.92;u.pitch=pref==='female'?1.12:pref==='male'?.86:1;
      const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2)));
      const pick=pref==='female'?vs.find(v=>/female|femme|amelie|aurelie|julie|marie|samantha|zira|hortense|denise|google/i.test(v.name)):pref==='male'?vs.find(v=>/male|homme|thomas|daniel|paul|david|henri|claude/i.test(v.name)):null;
      if(pick||vs[0])u.voice=pick||vs[0];u.onend=onend;speechSynthesis.speak(u);return {mode:'device'}}catch(e){}}
    return {mode:'simulated'}},
  stop(){try{speechSynthesis.cancel()}catch(e){}},
  transcribe(){return {error:'not_available_in_demo'}},
  translate({text}){return {text,simulated:true}}
};

   5. DOMAINE — règles métier et registre

const KEY='tonti.v5';
let S=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return null}
function setOffset(n){S.dayOffset=n;TODAY=addDays(BASE,n);save()}
function dueDate(g,r){const s=parse(g.start);return g.freq==='mensuel'?addMonths(s,r):addDays(s,(g.freq==='hebdo'?7:14)*r)}
const FREQ=()=>({hebdo:t('f.week','chaque semaine'),quinzaine:t('f.fortnight','chaque quinzaine'),mensuel:t('f.month','chaque mois')});
const PER=()=>({hebdo:t('per.week','semaine'),quinzaine:t('per.fortnight','quinzaine'),mensuel:t('per.month','mois')});
const P=id=>S.people[id]||{id,name:'?',phone:'',score:50,v:{},acct:'bank',cc:'ML'};
const G=id=>S.groups.find(g=>g.id===id);
const mine=()=>S.groups.filter(g=>g.order.includes(S.me));
const pot=g=>g.amount*g.order.length;
const fee=g=>Math.round(g.amount*g.fundPct/100);
const due=g=>g.amount+fee(g);
const first=id=>P(id).name.split(' ')[0];
const isT=g=>g.treasurer===S.me;
const CC=g=>COUNTRIES[g.cc];
const verified=p=>P(p).v.id==='verified';

/* Registre : toute opération d’argent passe par recordTx. Statuts : success | pending | submitted | refused | failed | insufficient | expired */
function recordTx(o){const tx={id:'TX'+uid(),d:iso(TODAY),t:nowT(),...o};S.tx.push(tx);return tx}
const txById=id=>S.tx.find(x=>x.id===id);
const COUNTED=['success'];
function activeContrib(g,r,p){return S.tx.find(x=>x.gid===g.id&&x.r===r&&x.p===p&&x.kind==='contrib'&&['success','pending','submitted'].includes(x.st))}

function applyTx(tx){
  const g=G(tx.gid),e=g.rounds[tx.r].pay[tx.p];
  if(tx.kind==='contrib'){
    if(tx.st==='success'){Object.assign(e,{s:'ok',tx:tx.id});delete e.late;delete e.med;delete e.rej;g.fund+=tx.fee}
    else if(tx.st==='pending'){Object.assign(e,{s:'pending',tx:tx.id})}
    else if(tx.st==='submitted'){Object.assign(e,{s:'submitted',tx:tx.id})}
    else{if(e.tx===tx.id||!['ok','cover'].includes(e.s)){e.s='wait';delete e.tx}e.lastFail=tx.st}
  }
}
/* Cotisation : idempotente — une seule cotisation active par membre et par tour */
function contribute(g,p,acct){
  const e=g.rounds[g.round].pay[p];
  if(['ok','cover','submitted','pending'].includes(e.s)||activeContrib(g,g.round,p))return {dup:true};
  const rail=acct==='cash'?'cash':g.rail;
  if(rail==='cash'){const tx=recordTx({kind:'contrib',gid:g.id,r:g.round,p,amount:g.amount,fee:fee(g),cur:g.cur,rail,acct,st:isT(g)&&p===S.me?'success':'submitted',ref:refFor('cash'),by:isT(g)?S.me:null});applyTx(tx);return {tx}}
  const res=Services.payments.request({idem:`${g.id}:${g.round}:${p}`,group:g.id,round:g.round,payer:p,payee:g.treasurer,amount:due(g),currency:g.cur,rail,account:acct});
  const tx=recordTx({kind:'contrib',gid:g.id,r:g.round,p,amount:g.amount,fee:fee(g),cur:g.cur,rail,acct,st:res.status,ref:res.ref||null,reason:res.reason||null});
  applyTx(tx);
  if(res.status==='success'){bump(p,daysBetween(dueDate(g,g.round),TODAY)<=0?1:-2);log(g,'log.paid',{who:P(p).name,rail:railName(rail)},'ok')}
  if(res.status==='pending')Services.notify.send({to:P(p).phone,channel:'sms',text:t('sms.approve','TONTI : approuvez la demande de {amt} dans votre application {acct}.',{amt:money(due(g),g.cur),acct:acctName(acct)})});
  return {tx};
}
function settlePending(tx,approved){const g=G(tx.gid);const res=Services.payments.settlePending(tx,approved);tx.st=res.status;tx.d=iso(TODAY);tx.t=nowT();applyTx(tx);
  if(res.status==='success')log(g,'log.paid',{who:P(tx.p).name,rail:railName(tx.rail)},'ok');save()}
function confirmCash(tx,ok,reason){const g=G(tx.gid);tx.st=ok?'success':'refused';tx.by=S.me;tx.reason=ok?null:reason;applyTx(tx);
  if(ok){bump(tx.p,tx.d<=iso(dueDate(g,tx.r))?1:-2);log(g,'log.cashok',{who:P(tx.p).name},'ok')}
  else{g.rounds[tx.r].pay[tx.p].rej=reason;log(g,'log.cashno',{who:P(tx.p).name},'warn')}save()}
function coverMember(g,p,how){
  const e=g.rounds[g.round].pay[p];if(['ok','cover'].includes(e.s))return false;
  if(how==='fund'&&g.fund<g.amount)return false;
  if(how==='caution'&&g.cautions[p]!=='held')return false;
  if(how==='garant'&&!g.guarantors[p])return false;
  const tx=recordTx({kind:'cover',how,gid:g.id,r:g.round,p,amount:g.amount,fee:0,cur:g.cur,rail:how==='garant'?g.rail:'internal',st:'success',ref:refFor(how==='garant'?g.rail:'x'),payer:how==='garant'?g.guarantors[p]:null});
  Object.assign(e,{s:'cover',tx:tx.id,how});delete e.late;delete e.med;
  if(how==='caution')g.cautions[p]='used';
  if(how==='fund'){g.fund-=g.amount;g.debts[p]=(g.debts[p]||0)+g.amount}
  if(how==='garant')g.debts[p]=(g.debts[p]||0);
  bump(p,how==='garant'?-8:how==='caution'?-10:-15);
  log(g,'log.cover.'+how,{who:P(p).name,gar:g.guarantors[p]?P(g.guarantors[p]).name:''},how==='fund'?'bad':'gold');
  save();return true;
}
function coverOptions(g,p){return {garant:!!g.guarantors[p],caution:g.cautions[p]==='held'&&g.caution>0,fund:g.fund>=g.amount}}
function canCover(g,p){const o=coverOptions(g,p);return o.garant||o.caution||o.fund}
/* Levée : complète, ou partielle si couverture insuffisante (le manque est enregistré) */
function doPayoutDomain(g,partial){
  const r=g.round,to=g.order[r],ri=roundInfo(g),amount=partial?ri.collected:pot(g);
  if(!partial&&ri.ok<g.order.length)return {err:'incomplete'};
  if(g.payouts[r])return {err:'dup'};
  const cap=CUR[g.cur].cap,parts=cap&&g.rail==='pispi'?Math.ceil(amount/cap):1;
  const res=Services.payments.payout({idem:`${g.id}:${r}:payout`,group:g.id,round:r,beneficiary:to,amount,currency:g.cur,rail:g.rail,parts});
  const tx=recordTx({kind:'payout',gid:g.id,r,p:to,amount,fee:0,cur:g.cur,rail:g.rail,st:res.status,ref:(res.refs||[])[0]||null,refs:res.refs||[],parts});
  if(res.status!=='success'){log(g,'log.payoutfail',{who:P(to).name},'bad');save();return {tx}}
  g.payouts[r]={to,d:iso(TODAY),amount,by:S.me,tx:tx.id,partial:!!partial};
  if(partial){const short=pot(g)-amount;g.owed[to]=(g.owed[to]||0)+short;
    g.order.forEach(p=>{const e=g.rounds[r].pay[p];if(!['ok','cover'].includes(e.s)){e.s='unpaid';g.debts[p]=(g.debts[p]||0)+g.amount}});
    log(g,'log.partial',{amt:money(amount,g.cur),who:P(to).name,short:money(short,g.cur)},'bad')}
  else log(g,'log.payout',{r:r+1,amt:money(amount,g.cur),who:P(to).name},'ok');
  Services.notify.send({to:P(to).phone,channel:'sms',text:t('sms.payout','TONTI : {amt} versés sur votre compte.',{amt:money(amount,g.cur)})});
  g.round++;
  if(g.round>=g.order.length){g.status='done';g.round=g.order.length-1;Object.keys(g.cautions).forEach(k=>{if(g.cautions[k]==='held')g.cautions[k]='refunded'});log(g,'log.done',{},'ok')}
  else{g.rounds[g.round]={pay:Object.fromEntries(g.order.map(p=>[p,{s:'wait'}]))};g.order.forEach(p=>Services.notify.send({to:P(p).phone,channel:'sms',text:t('sms.request','TONTI : demande de paiement de {amt} pour « {g} ».',{amt:money(due(g),g.cur),g:g.name})}))}
  save();return {tx};
}
function repayDebt(g,p){const d=g.debts[p]||0;if(!d)return;const tx=recordTx({kind:'repay',gid:g.id,r:g.round,p,amount:d,fee:0,cur:g.cur,rail:g.rail,st:'success',ref:refFor(g.rail)});
  g.debts[p]=0;const owedTo=Object.keys(g.owed).find(k=>g.owed[k]>0);if(owedTo){g.owed[owedTo]=Math.max(0,g.owed[owedTo]-d)}else g.fund+=d;
  log(g,'log.repay',{who:P(p).name,amt:money(d,g.cur)},'ok');save()}

const bump=(pid,d)=>{const p=P(pid);p.score=Math.max(0,Math.min(100,p.score+d))};

const logText=x=>{const L={

  'log.arr':t('log.arr','Demande d’arrangement de {who}.')}[x.k];return L?L.replace(/\{(\w+)\}/g,(m,k)=>x.v&&x.v[k]!==undefined?x.v[k]:m):''};

function disp(g,r,p){
  const e=g.rounds[r]?.pay[p]||{s:'wait'};
  if(['ok','cover','submitted','pending','unpaid'].includes(e.s))return e.s;
  if(r!==g.round||g.status!=='active')return 'wait';
  if(e.med)return 'med';
  const k=daysBetween(dueDate(g,r),TODAY);
  if(e.late||k>2)return 'late';if(k>0)return 'grace';return 'wait';
}
const ST=()=>({ok:[t('st.ok','Payé'),'ok',IC.check],cover:[t('st.cover','Couvert'),'gold',IC.shield],submitted:[t('st.submitted','À confirmer'),'gold',IC.cash],pending:[t('st.pending','En attente'),'gold',IC.clock],
  wait:[t('st.wait','À payer'),'neutral',IC.clock],grace:[t('st.grace','Délai de grâce'),'warn',IC.hourglass],late:[t('st.late','En retard'),'bad',IC.alert],med:[t('st.med','Médiation'),'warn',IC.hand],unpaid:[t('st.unpaid','Impayé'),'bad',IC.x]});
const stChip=(s,sm)=>{const x=ST()[s];return `<span class="chip ${x[1]} ${sm?'sm':''}">${I(x[2],sm?11:13,2.6)}${x[0]}</span>`};
function roundInfo(g,r=g.round){let ok=0,wait=0,late=0;g.order.forEach(p=>{const s=disp(g,r,p);if(s==='ok'||s==='cover')ok++;else if(['submitted','pending'].includes(s))wait++;else if(['late','med','unpaid'].includes(s))late++});return {ok,wait,late,n:g.order.length,collected:ok*g.amount}}
function coverage(g){
  let exposure=0,seizable=0,guaranteed=0;const n=g.order.length;
  if(g.status==='active')g.order.forEach((p,i)=>{if(i>=g.round)return;const s=disp(g,g.round,p);
    const owed=Math.max(0,(n-g.round)-(s==='ok'||s==='cover'?1:0))*g.amount;if(!owed)return;exposure+=owed;
    const cau=g.cautions[p]==='held'?Math.min(owed,g.caution*g.amount):0;seizable+=cau;if(g.guarantors[p])guaranteed+=owed-cau});
  return {exposure,seizable,guaranteed,ratio:exposure?Math.min(1,(g.fund+seizable+guaranteed)/exposure):1};
}
function punct(groups,p){let ok=0,tot=0;
  groups.forEach(g=>{for(let r=0;r<=g.round;r++){const dd=iso(dueDate(g,r)),past=r<g.round||g.status!=='active';
    g.order.forEach(q=>{if(p&&q!==p)return;const e=g.rounds[r]?.pay[q];if(!e)return;const d=disp(g,r,q);
      const tx=e.tx&&txById(e.tx);
      if(e.s==='ok'){tot++;if(tx&&tx.d<=dd)ok++}else if(['cover','unpaid'].includes(e.s)||past||['late','med','grace'].includes(d))tot++})}});
  return tot?Math.round(ok/tot*100):100}
function myStats(){
  const given={},got={},dues=[],nexts=[];
  S.tx.forEach(x=>{if(x.st!=='success')return;const g=G(x.gid);if(!g||!g.order.includes(S.me))return;
    if(x.kind==='contrib'&&x.p===S.me)given[x.cur]=(given[x.cur]||0)+x.amount;
    if(x.kind==='payout'&&x.p===S.me)got[x.cur]=(got[x.cur]||0)+x.amount});
  mine().forEach(g=>{if(g.status!=='active')return;const pos=g.order.indexOf(S.me);if(pos>=g.round)nexts.push({g,date:dueDate(g,pos),pos});
    const s=disp(g,g.round,S.me);if(['wait','grace','late','med'].includes(s))dues.push({g,date:dueDate(g,g.round),s})});
  const rank={late:0,med:0,grace:1,wait:2};
  return {given,got,dues:dues.sort((a,b)=>rank[a.s]-rank[b.s]||a.date-b.date),nexts:nexts.sort((a,b)=>a.date-b.date)};
}

function countdown(days,total,label,color='#fff',track='rgb(255 255 255 / .2)'){
  const c=2*Math.PI*36,f=Math.max(0,Math.min(1,1-days/Math.max(total,1)));
  return `<div class="cd"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="${track}" stroke-width="7"/><circle cx="42" cy="42" r="36" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}"/></svg><div class="v"><b>${Math.abs(days)}</b><span>${label}</span></div></div>`;
}
const periodDays=g=>g.freq==='hebdo'?7:g.freq==='quinzaine'?14:30;
function wheel(g,{center=true}={}){
  const n=g.order.length,R=86,cx=110,cy=110,sr=n>10?13:15,pos=g.order.indexOf(S.me),done=g.status!=='active',me_=t('w.me','MOI');
  let seats='';
  g.order.forEach((p,i)=>{const a=i/n*Math.PI*2-Math.PI/2,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),past=done||i<g.round,now=!done&&i===g.round,me=p===S.me;
    const fill=past?'var(--primary)':now?'var(--gold)':me?'var(--gold-soft)':'var(--seat)';
    const ink=past||now?'#fff':me?'var(--gold-ink)':'var(--seat-ink)';
    seats+=`<g>${me?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sr+4.5}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`:''}
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sr}" fill="${fill}"/>
      ${past?`<path d="M${(x-5).toFixed(1)} ${y.toFixed(1)}l3.5 3.5 6.5-7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`
        :`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="${me?(me_.length>3?8.5:10.5):11}" font-weight="800" fill="${ink}" font-family="Plus Jakarta Sans,Noto Sans Arabic,system-ui,sans-serif">${me?esc(me_):i+1}</text>`}</g>`});
  const prog=done?1:g.round/n,c=2*Math.PI*(R+24);
  let ctr='';
  if(center){const k=daysBetween(TODAY,dueDate(g,pos));
    const [b,s]=done?[t('w.done','Terminé'),t('w.done2','cycle complet')]:pos<g.round?[t('w.got','Reçu ✓'),dShort(parse(g.payouts[pos]?.d||iso(dueDate(g,pos))))]:pos===g.round?[t('w.mine','Mon tour !'),k>0?t('w.inN','levée dans {n} j',{n:k}):t('w.now','levée en cours')]:[t('w.days','{n} jours',{n:k}),t('w.before','avant mon tour')];
    ctr=`<div class="center">${cowImg(38,'margin:0 auto 2px')}<b>${b}</b><span>${s}</span></div>`}
  return `<div class="wheel" role="img" aria-label="${esc(t('w.aria','Tour {r} sur {n}. Mon tour : {m}.',{r:Math.min(g.round+1,n),n,m:pos+1}))}"><svg viewBox="0 0 220 220" style="direction:ltr">
    <circle cx="${cx}" cy="${cy}" r="${R+24}" fill="none" stroke="var(--line)" stroke-width="5"/>
    <circle cx="${cx}" cy="${cy}" r="${R+24}" fill="none" stroke="var(--primary)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-prog)}" transform="rotate(-90 ${cx} ${cy})"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 5"/>${seats}</svg>${ctr}</div>`;
}
const legend=()=>`<div class="legend"><span><i style="background:var(--primary)"></i>${t('lg.got','Déjà reçu')}</span><span><i style="background:var(--gold)"></i>${t('lg.now','Tour en cours')}</span><span><i style="background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)"></i>${t('lg.me','Moi')}</span><span><i style="background:var(--seat)"></i>${t('lg.next','À venir')}</span></div>`;
function potGrid(g){const r=g.round,ben=g.order[r];
  return `<div class="pot">${g.order.map(p=>{const s=disp(g,r,p);
    const cls=s==='ok'||s==='cover'?'ok':['submitted','pending'].includes(s)?'sub off':['late','med','unpaid'].includes(s)?'late off':'off';
    const badge=s==='ok'||s==='cover'?['var(--secondary)',IC.check]:['late','med','unpaid'].includes(s)?['var(--bad)',IC.alert]:['submitted','pending'].includes(s)?['var(--gold)',IC.clock]:null;
    return `<button class="c ${cls} ${p===ben?'ben':''}" data-act="member" data-g="${g.id}" data-p="${p}" aria-label="${esc(P(p).name)} : ${ST()[s][0]}">
      <span class="s">${cowImg(26)}${badge?`<span class="m" style="background:${badge[0]}">${I(badge[1],10,3.2)}</span>`:''}</span><span>${p===S.me?t('lg.me','Moi'):esc(first(p))}</span></button>`}).join('')}</div>`}
function beads(g){const done=g.status!=='active';
  return `<div class="beads" data-beads>${g.order.map((p,i)=>{const past=done||i<g.round,now=!done&&i===g.round,me=p===S.me;
    return `<div class="bead ${past?'done':''} ${now?'now':''} ${me?'mine':''}" ${now?'data-now':''}>${me?`<span class="tag">${esc(t('w.me','MOI'))}</span>`:''}
      <span class="o">${past?I(IC.check,18,3):me?I(IC.star,18,2.4):i+1}</span><span class="d">${dShort(dueDate(g,i))}</span><span class="w">${me?t('b.mine','Mon tour'):esc(first(p))}</span></div>`}).join('')}</div>`}

const vset=()=>{if(!S)S={account:false};if(!S.voice)S.voice={lang:ob.vlang||(SPOKEN[LANG]&&!SPOKEN[LANG].planned?LANG:'fr'),pref:'none',auto:false};return S.voice};
let playTimer=null;
function say(builder,langOverride){
  const vs=vset(),lang=langOverride||vs.lang;MISS=0;
  const text=withLang(DICT[lang]||lang==='fr'?lang:'fr',builder),missing=MISS>0&&lang!=='fr';
  const res=Services.voice.speak({text,lang,pref:vs.pref,onend:()=>hidePlayer()});
  showPlayer(text,lang,res.mode,missing);
}
function showPlayer(text,lang,mode,missing){
  const pl=$('#player');clearTimeout(playTimer);
  const sim=mode==='simulated',L=SPOKEN[lang]||{n:lang};
  pl.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span class="wave" aria-hidden="true">${Array.from({length:14},(_,i)=>`<i style="animation-delay:${(i*.07).toFixed(2)}s"></i>`).join('')}</span>
    <span class="grow md">${esc(L.n)} · ${sim?esc(t('vo.simmode','Lecture simulée : aucune voix générée')):esc(t('vo.devmode','Voix de l’appareil'))}</span>
    <button class="ibtn" style="width:36px;height:36px;color:#fff" data-act="stopVoice" aria-label="${esc(t('a.close','Fermer'))}">${I(IC.x,18,2.4)}</button></div>
    <div class="tx" ${['bm','wo'].includes(lang)&&!missing?`lang="${lang}"`:''}>${esc(text)}</div>
    ${missing?`<div class="md" style="color:#F6C9A0">${esc(t('vo.missing','Traduction à venir pour une partie du texte : affichée en français.'))}</div>`:''}
    ${sim?`<div class="md" style="color:#BFD8C8">${esc(t('vo.prov','Prestataire à connecter : {p}.',{p:L.prov||'—'}))}</div><button class="btn sm white" data-act="sayFr">${I(IC.speaker,16)}${esc(t('vo.fr','Écouter en français (voix de l’appareil)'))}</button>`:''}`;
  const sh=$('.sheet');pl.style.top=sh?'calc(10px + env(safe-area-inset-top,0px))':'';pl.style.bottom=sh?'auto':'';
  pl.hidden=false;pl._last=null;
  if(sim)playTimer=setTimeout(hidePlayer,Math.min(16000,2500+text.length*55));
}

    :sMe==='submitted'?`<div class="card" style="display:flex;gap:12px;align-items:center;background:var(--gold-soft);border-color:transparent"><span class="ricon gold" style="background:var(--surface)">${I(IC.cash,24)}</span><div class="grow"><div class="name">${t('g.cashgiven','Espèces remises')}</div><div class="sub">${t('g.cashwait','Le trésorier doit confirmer')}</div></div></div>`

      <div style="text-align:end">${amt(pot(g),g.cur,'19px')}<div class="sub">${k>=0?inDays(k):dShort(dueDate(g,r))}</div></div></div>

function syncDraft(){if(!draft)return;const v=id=>{const e=document.getElementById(id);return e?e.value:null};

  if(v('c-amount')!==null)draft.amount=Math.max(0,parseInt(v('c-amount').replace(/\D/g,''))||0);

function protectedOrder(ids){const a=ids.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}const risky=p=>P(p).score<65||!verified(p);return a.filter(p=>!risky(p)).concat(a.filter(risky))}
function assignGuarantors(g){const byScore=Object.values(S.people).map(p=>p.id).sort((a,b)=>P(b).score-P(a).score);
